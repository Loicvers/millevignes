<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Une interdiction qui dure</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">frise, échelle non respectée</text>
  <path d="M20 52 H540" stroke="#1a1612" stroke-width="1.5"/>
  <g fill="#a8843a"><circle cx="60" cy="52" r="5"/><circle cx="200" cy="52" r="5"/><circle cx="360" cy="52" r="5"/><circle cx="500" cy="52" r="5"/></g>
  <g text-anchor="middle">
    <text x="60" y="38" font-weight="700" fill="#5b1a24">24 déc. 1934</text><text x="60" y="72" font-size="10">la loi</text>
    <text x="200" y="38" font-weight="700" fill="#5b1a24">1935</text><text x="200" y="72" font-size="10">décret d'application</text><text x="200" y="85" font-size="10">(date de Lepeltier)</text>
    <text x="360" y="38" font-weight="700" fill="#5b1a24">1987</text><text x="360" y="72" font-size="10">repris par le</text><text x="360" y="85" font-size="10">droit européen</text>
    <text x="500" y="38" font-weight="700" fill="#5b1a24">2026</text><text x="500" y="72" font-size="10">toujours en vigueur</text>
  </g>
</svg>

    <text x="490" y="22" font-weight="700" fill="#5b1a24">Égrappé, foulé, fût</text><text x="490" y="36" font-size="10" fill="#625a4e">« à la bourguignonne »</text>
    <text x="490" y="74">coloré, corsé, tannique</text>

  <g fill="#5b1a24"><circle cx="70" cy="50" r="6"/><circle cx="280" cy="50" r="6"/><circle cx="490" cy="50" r="6"/></g>
  <g text-anchor="middle">
    <text x="70" y="22" font-weight="700" fill="#5b1a24">Grappes entières</text><text x="70" y="36" font-size="10" fill="#625a4e">cuvaison courte</text>
    <text x="70" y="74">fruité, souple</text><text x="70" y="88" font-size="10" fill="#625a4e">à boire jeune</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">La kouloura, vue de profil</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <rect x="0" y="104" width="270" height="30" fill="#d8d0c2"/>
  <text x="6" y="124" font-size="10" fill="#625a4e">sol volcanique</text>
  <ellipse cx="170" cy="96" rx="58" ry="12" fill="none" stroke="#5c7a4f" stroke-width="9"/>
  <g fill="#5b1a24"><circle cx="150" cy="96" r="5"/><circle cx="168" cy="98" r="5"/><circle cx="186" cy="96" r="5"/></g>
  <path d="M8 78 H86" stroke="#456e8a" stroke-width="2"/><path d="M84 73 L94 78 L84 83 z" fill="#456e8a"/><text x="8" y="70" font-size="10" fill="#456e8a">vent</text>
  <g stroke="#a8843a" stroke-width="1.5"><circle cx="232" cy="38" r="8" fill="#faf3e0"/><path d="M232 22 V26 M232 50 V54 M216 38 H220 M244 38 H248 M221 27 l3 3 M243 27 l-3 3 M221 49 l3 -3 M243 49 l-3 -3"/></g>
  <text x="232" y="68" text-anchor="middle" font-size="10" fill="#a8843a">soleil</text>
  <g fill="#456e8a"><circle cx="150" cy="44" r="2"/><circle cx="170" cy="56" r="2"/><circle cx="190" cy="46" r="2"/><circle cx="160" cy="68" r="2"/><circle cx="180" cy="70" r="2"/></g>
  <text x="170" y="30" text-anchor="middle" font-size="10" fill="#456e8a">humidité nocturne</text>
  <rect x="300" y="30" width="260" height="84" rx="8" fill="#faf3e0" stroke="#a8843a"/>
  <text x="312" y="50" font-weight="700" fill="#5b1a24">Kouloura</text>
  <g font-size="10"><text x="312" y="68">Vigne enroulée en couronne</text><text x="312" y="81">au ras du sol : elle protège</text><text x="312" y="94">les grappes du vent et du soleil</text><text x="312" y="107">et capte l'humidité nocturne.</text></g>
</svg>

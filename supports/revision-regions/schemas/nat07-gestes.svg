  <g stroke="#1a1612"><path d="M65 60 V76"/><path d="M208 60 V76"/><path d="M351 60 V76"/><path d="M494 60 V76"/></g>
  <g font-size="10" text-anchor="middle" fill="#625a4e">
    <text x="65" y="90">les pousses</text><text x="65" y="103">en excès</text>
    <text x="208" y="90">la position</text><text x="208" y="103">des rameaux</text>
    <text x="351" y="90">les extrémités</text><text x="351" y="103">des rameaux</text>

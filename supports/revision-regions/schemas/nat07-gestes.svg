<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Quatre gestes, quatre cibles</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g font-weight="700" text-anchor="middle">
    <rect x="0" y="30" width="130" height="30" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="65" y="49">Ébourgeonnage</text>
    <rect x="143" y="30" width="130" height="30" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="208" y="49">Relevage</text>
    <rect x="286" y="30" width="130" height="30" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="351" y="49">Rognage</text>
    <rect x="429" y="30" width="131" height="30" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="494" y="49">Effeuillage</text>

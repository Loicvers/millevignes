<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 108" font-family="Inter, sans-serif" font-size="10" fill="#1a1612">
  <text x="0" y="12" font-size="11" font-weight="700" fill="#5b1a24">Du calcaire au 41 B</text><text x="560" y="12" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="0" y="24" width="124" height="72" rx="6"/><rect x="145" y="24" width="124" height="72" rx="6"/><rect x="290" y="24" width="124" height="72" rx="6"/><rect x="435" y="24" width="124" height="72" rx="6"/></g>
  <g text-anchor="middle">
    <g font-size="11" font-weight="700" fill="#5b1a24"><text x="62" y="40">Riparia, rupestris</text><text x="207" y="40">Sur calcaire</text><text x="352" y="40">V. berlandieri</text><text x="497" y="40">41 B</text></g>
    <text x="62" y="56">venus de sols</text><text x="62" y="69">américains plutôt</text><text x="62" y="82">acides</text>
    <text x="207" y="56">chlorose ferrique :</text><text x="207" y="69">fer mal absorbé,</text><text x="207" y="82">feuilles jaunes</text>
    <text x="352" y="56">tolère le calcaire,</text><text x="352" y="69">mais se greffe et</text><text x="352" y="82">s’enracine mal</text>
    <text x="497" y="56">chasselas ×</text><text x="497" y="69">berlandieri (1882) :</text><text x="497" y="82">Cognac, Champagne</text>
  </g>
  <g stroke="#a8843a" stroke-width="1.4" fill="none"><path d="M126 60 H141"/><path d="M271 60 H286"/><path d="M416 60 H431"/></g>
  <g fill="#a8843a"><path d="M143 56 L143 64 L149 60 Z" transform="translate(-4 0)"/><path d="M288 56 L288 64 L294 60 Z" transform="translate(-4 0)"/><path d="M433 56 L433 64 L439 60 Z" transform="translate(-4 0)"/></g>

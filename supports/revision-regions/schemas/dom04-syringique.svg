<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Lire la couleur d’un vin dans une jarre</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="0" y="28" width="170" height="44" rx="6"/><rect x="195" y="28" width="150" height="44" rx="6"/><rect x="370" y="28" width="190" height="44" rx="6" stroke="#5b1a24"/></g>
  <g text-anchor="middle"><text x="85" y="46" font-weight="700" fill="#5b1a24">Raisin noir</text><text x="85" y="61" font-size="10">malvidine (anthocyane)</text>
  <text x="270" y="46" font-weight="700" fill="#a8843a">Dégradation</text><text x="270" y="61" font-size="10">du pigment</text>
  <text x="465" y="46" font-weight="700" fill="#5b1a24">Acide syringique</text><text x="465" y="61" font-size="10">signe d’un vin rouge</text></g>
  <g stroke="#a8843a" stroke-width="1.5" fill="#a8843a"><path d="M172 50 H191"/><path d="M347 50 H366"/><path d="M191 50 l-5 -3 v6 z"/><path d="M366 50 l-5 -3 v6 z"/></g>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="0" y="86" width="560" height="52" rx="6"/></g>
  <text x="14" y="106"><tspan font-weight="700" fill="#456e8a">Tartrique sans syringique</tspan> : compatible avec un vin blanc (une inférence).</text>
  <text x="14" y="124" font-size="10" fill="#625a4e">Limite : l’acide syringique se forme aussi dans d’autres plantes et dans les sols ; son absence ne prouve pas un blanc.</text>
</svg>

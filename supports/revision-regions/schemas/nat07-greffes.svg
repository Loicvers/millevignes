  <text x="0" y="14" font-weight="700" fill="#5b1a24">Symptômes foliaires d'esca selon la greffe (étude de 2017)</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe : longueurs indicatives</text>

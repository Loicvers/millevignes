<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <path d="M40 12 V130 H320" stroke="#625a4e" fill="none"/>
  <text x="46" y="20" font-size="10" fill="#625a4e">teneur dans la baie</text><text x="320" y="146" text-anchor="end" font-size="10" fill="#625a4e">temps</text>
  <path d="M170 18 V130" stroke="#a8843a" stroke-dasharray="4 3"/><text x="170" y="146" text-anchor="middle" font-size="10" fill="#a8843a">véraison</text>
  <path d="M45 110 C100 80 140 40 170 36 C210 40 250 90 315 108" stroke="#5c7a4f" stroke-width="2.5" fill="none"/>
  <path d="M45 105 C90 85 130 72 170 70 C220 68 270 70 315 72" stroke="#5b1a24" stroke-width="2.5" fill="none"/>
  <text x="324" y="106" font-weight="700" fill="#5c7a4f" font-size="10.5">malique : baisse,</text><text x="324" y="120" fill="#5c7a4f" font-size="10">surtout s'il fait chaud</text>
  <text x="324" y="70" font-weight="700" fill="#5b1a24" font-size="10.5">tartrique :</text><text x="324" y="84" fill="#5b1a24" font-size="10">à peu près stable</text>
  <rect x="440" y="20" width="120" height="110" rx="6" fill="#faf3e0" stroke="#a8843a"/>
  <text x="500" y="40" text-anchor="middle" font-weight="700" fill="#5b1a24">Le potassium</text>
  <text x="500" y="60" text-anchor="middle" font-size="10">principal cation,</text><text x="500" y="74" text-anchor="middle" font-size="10">se lie aux acides</text><text x="500" y="88" text-anchor="middle" font-size="10">et les neutralise :</text><text x="500" y="108" text-anchor="middle" font-weight="700">le pH monte</text>
  <text x="44" y="164" font-size="10" fill="#625a4e">Courbes de principe : tartrique et malique font en moyenne 90 % des acides du raisin.</text>
</svg>

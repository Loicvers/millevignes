<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Une récolte se prépare un an à l'avance</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <rect x="0" y="28" width="170" height="64" rx="8" fill="#faf3e0" stroke="#a8843a"/>
  <text x="85" y="46" text-anchor="middle" font-weight="700" fill="#5b1a24">Année N</text>
  <text x="85" y="63" text-anchor="middle" font-size="10">Dans les yeux, les ébauches</text><text x="85" y="76" text-anchor="middle" font-size="10">de la récolte N+1 se forment</text>
  <path d="M174 60 H188" stroke="#a8843a" stroke-width="2"/><path d="M186 55 L194 60 L186 65 z" fill="#a8843a"/>
  <rect x="195" y="28" width="170" height="64" rx="8" fill="#faf3e0" stroke="#a8843a"/>
  <text x="280" y="46" text-anchor="middle" font-weight="700" fill="#5b1a24">Hiver</text>
  <text x="280" y="68" text-anchor="middle" font-size="10">Les yeux passent l'hiver</text>
  <path d="M369 60 H383" stroke="#a8843a" stroke-width="2"/><path d="M381 55 L389 60 L381 65 z" fill="#a8843a"/>
  <rect x="390" y="28" width="170" height="64" rx="8" fill="#faf3e0" stroke="#a8843a"/>
  <text x="475" y="46" text-anchor="middle" font-weight="700" fill="#5b1a24">Année N+1</text>
  <text x="475" y="63" text-anchor="middle" font-size="10">Les bourgeons débourrent</text><text x="475" y="76" text-anchor="middle" font-size="10">et portent les grappes</text>
  <text x="0" y="108" font-size="10" fill="#625a4e">Les trois temps de Lepeltier : N−1, N et N+1.</text>
</svg>

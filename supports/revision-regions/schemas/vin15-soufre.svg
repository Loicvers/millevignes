<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 108" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Le soufre : trois dates, trois degrés de certitude</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">frise non à l'échelle</text>
  <path d="M10 62 H550" stroke="#625a4e" stroke-width="1.5"/>
  <circle cx="100" cy="62" r="6" fill="#faf3e0" stroke="#a8843a" stroke-width="2" stroke-dasharray="3 2"/><circle cx="290" cy="62" r="6" fill="#5c7a4f"/><circle cx="470" cy="62" r="6" fill="#faf3e0" stroke="#a8843a" stroke-width="2" stroke-dasharray="3 2"/>
  <g font-weight="700" font-size="12" text-anchor="middle" fill="#5b1a24"><text x="100" y="46">1487</text><text x="290" y="46">XVIIe siècle</text><text x="470" y="46">1765</text></g>
  <g font-size="10" text-anchor="middle"><text x="100" y="84">copeaux soufrés (texte allemand)</text><text x="100" y="97">souvent cité, date débattue</text><text x="290" y="84">mèche hollandaise</text><text x="290" y="97">attestée par les sources lues</text><text x="470" y="84">mèche hollandaise selon le livre</text><text x="470" y="97">date non retrouvée</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Une maladie, un substrat</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="0" y="24" width="131" height="96" rx="4"/><rect x="143" y="24" width="131" height="96" rx="4"/><rect x="286" y="24" width="131" height="96" rx="4"/><rect x="429" y="24" width="131" height="96" rx="4"/></g>
  <g font-weight="700" fill="#5b1a24"><text x="10" y="44">Piqûre lactique</text><text x="153" y="44">Tourne</text><text x="296" y="44">Graisse</text><text x="439" y="44">Amertume</text></g>
  <g font-size="10"><text x="10" y="64">Sucre résiduel</text><text x="10" y="78">→ acide acétique</text><text x="153" y="64">Acide tartrique</text><text x="153" y="78">dégradé</text><text x="296" y="64">Glucose résiduel</text><text x="296" y="78">→ glucane</text><text x="439" y="64">Glycérol dégradé</text><text x="439" y="78">→ précurseur</text><text x="439" y="92">d’acroléine</text></g>
  <g font-size="10" fill="#625a4e" font-style="italic"><text x="10" y="108">nez de vinaigre</text><text x="153" y="108">acidité fixe en chute</text><text x="296" y="108">vin visqueux, filant</text><text x="439" y="108">se combine aux tanins</text></g>
</svg>

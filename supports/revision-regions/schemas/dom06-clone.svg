<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Un clone agréé : sa carte d'identité</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="30" width="170" height="62" rx="6"/>
    <rect x="195" y="30" width="170" height="62" rx="6" stroke="#a8843a"/>
    <rect x="390" y="30" width="170" height="62" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="85" y="52" font-weight="700">Catalogue officiel</text><text x="85" y="67">seules les variétés</text><text x="85" y="80">inscrites sont plantables</text>
    <text x="280" y="52" font-weight="700" fill="#5b1a24">Un numéro d'agrément</text><text x="280" y="67">le clone est identifié</text><text x="280" y="80">et suivi</text>
    <text x="475" y="52" font-weight="700">Un certificat de santé</text><text x="475" y="67">pas de virus graves :</text><text x="475" y="80">court-noué, enroulement</text>
  </g>
  <text x="0" y="112" font-size="9.5" fill="#625a4e">Le but premier de la sélection clonale est sanitaire.</text>
</svg>

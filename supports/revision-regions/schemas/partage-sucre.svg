<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Où part le sucre fermenté ?</text><text x="560" y="14" text-anchor="end" font-size="9.5" fill="#625a4e" font-style="italic">largeurs indicatives</text>
  <rect x="0" y="26" width="470" height="34" fill="#5b1a24"/><text x="235" y="48" text-anchor="middle" fill="#fff" font-weight="700">l'essentiel : éthanol + CO2</text>
  <rect x="470" y="26" width="72" height="34" fill="#a8843a"/><text x="506" y="48" text-anchor="middle" fill="#fff" font-weight="700">≈ 8 %</text>
  <rect x="542" y="26" width="18" height="34" fill="#d8d0c2"/>
  <path d="M506 62 V78" stroke="#a8843a"/><text x="506" y="92" text-anchor="middle" font-weight="700" fill="#a8843a">glycérol</text><text x="506" y="106" text-anchor="middle" font-size="9.5">5 à 8 g/l dans le vin</text>
  <rect x="0" y="82" width="12" height="12" fill="#d8d0c2"/><text x="18" y="92" font-size="10">un peu d'acide succinique, d'acétaldéhyde</text><text x="18" y="106" font-size="10">et d'acide acétique</text>
</svg>

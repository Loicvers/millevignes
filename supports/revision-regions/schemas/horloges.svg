<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Trois horloges qui se désynchronisent</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g font-weight="700"><text x="0" y="44">Sucre</text><text x="0" y="78">Tanins (peau)</text><text x="0" y="112">Arômes</text></g>
  <rect x="110" y="32" width="430" height="16" rx="8" fill="#eee7da"/><rect x="110" y="32" width="250" height="16" rx="8" fill="#a8843a"/><text x="368" y="44" font-size="10" fill="#a8843a">plateau : il sonne en premier</text>
  <rect x="110" y="66" width="430" height="16" rx="8" fill="#eee7da"/><rect x="110" y="66" width="390" height="16" rx="8" fill="#5b1a24"/>
  <rect x="110" y="100" width="430" height="16" rx="8" fill="#eee7da"/><rect x="110" y="100" width="390" height="16" rx="8" fill="#456e8a"/>
  <path d="M360 26 V124" stroke="#1a1612" stroke-dasharray="4 3"/>
  <text x="360" y="140" text-anchor="middle" font-size="10">vendanger au sucre seul : ni tanins mûrs ni arômes garantis</text>
</svg>

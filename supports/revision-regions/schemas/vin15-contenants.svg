  <text x="0" y="14" font-weight="700" fill="#5b1a24">Les alternatives au fût neuf</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g stroke="#d8d0c2" fill="#faf3e0"><rect x="0" y="26" width="104" height="76" rx="6"/><rect x="114" y="26" width="104" height="76" rx="6"/><rect x="228" y="26" width="104" height="76" rx="6"/><rect x="342" y="26" width="104" height="76" rx="6"/><rect x="456" y="26" width="104" height="76" rx="6"/></g>

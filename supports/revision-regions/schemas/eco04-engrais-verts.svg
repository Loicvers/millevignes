<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" font-family="Inter, sans-serif" font-size="10.5" fill="#1a1612">
  <g text-anchor="middle">
    <rect x="0" y="8" width="176" height="74" rx="6" fill="#faf3e0" stroke="#5c7a4f"/><text x="88" y="29" font-weight="700" font-size="12" fill="#5c7a4f">Brassicacées</text><text x="88" y="44" font-size="9.5" fill="#625a4e">(crucifères)</text><text x="88" y="66">décompactent le sol</text>
    <rect x="192" y="8" width="176" height="74" rx="6" fill="#faf3e0" stroke="#5c7a4f"/><text x="280" y="29" font-weight="700" font-size="12" fill="#5c7a4f">Poacées</text><text x="280" y="44" font-size="9.5" fill="#625a4e">(graminées)</text><text x="280" y="66">décompactent le sol</text>
    <rect x="384" y="8" width="176" height="74" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="472" y="29" font-weight="700" font-size="12" fill="#5b1a24">Fabacées</text><text x="472" y="44" font-size="9.5" fill="#625a4e">(légumineuses)</text><text x="472" y="66">fixent l'azote</text>

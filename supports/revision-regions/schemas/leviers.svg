    <text x="386" y="41" font-weight="700" fill="#5b1a24">SO2</text><text x="386" y="55">trie au début ; l'excès bloque ;</text><text x="386" y="68">pas avec l'inoculation</text>
    <text x="386" y="136" font-weight="700" fill="#5b1a24">Azote et vitamines</text><text x="386" y="150">nourrissent la population</text>

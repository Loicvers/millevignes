<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 721" font-family="Inter, sans-serif" fill="#1a1612"><rect x="170" y="6" width="220" height="81" rx="6" fill="#f3e3e3" stroke="#5b1a24"/><text x="177" y="23" font-weight="700" font-size="11" fill="#5b1a24">Famille des Vitacées</text><text x="177" y="37" font-size="10">16 genres (Wen et al., 2018), 17 pour</text><text x="177" y="50" font-size="10">le livre</text><text x="177" y="63" font-size="9.5" font-style="italic" fill="#625a4e">apparue vers 100 millions d'années</text><text x="177" y="76" font-size="9.5" font-style="italic" fill="#625a4e">selon le livre</text><rect x="10" y="121" width="170" height="55" rx="6" fill="#fff" stroke="#d8d0c2"/><text x="17" y="138" font-weight="700" font-size="11" fill="#5b1a24">Les autres genres</text><text x="17" y="152" font-size="10">dont la vigne vierge : une</text><text x="17" y="165" font-size="10">cousine, d'un autre genre</text><rect x="250" y="121" width="300" height="55" rx="6" fill="#f3e3e3" stroke="#5b1a24"/><text x="257" y="138" font-weight="700" font-size="11" fill="#5b1a24">Genre Vitis</text><text x="257" y="152" font-size="10">une soixantaine d'espèces selon les flores, 83 dans la</text><text x="257" y="165" font-size="10">base POWO : le décompte varie selon les auteurs</text><path d="M280 87 V104.0 H95 V121" stroke="#625a4e" stroke-width="1.4" fill="none"/><path d="M280 87 V104.0 H400 V121" stroke="#625a4e" stroke-width="1.4" fill="none"/><rect x="10" y="210" width="220" height="120" rx="6" fill="#eef2f5" stroke="#456e8a"/><text x="17" y="227" font-weight="700" font-size="11" fill="#456e8a">Sous-genre Muscadinia (2n = 40)</text><text x="17" y="241" font-size="9.5" font-style="italic" fill="#625a4e">genre à part pour certains auteurs</text><text x="17" y="254" font-size="10">sud-est des États-Unis ; espèce phare :</text><text x="17" y="267" font-size="10">M. rotundifolia, la muscadine</text><text x="17" y="280" font-size="10">résiste au nématode du court-noué :</text><text x="17" y="293" font-size="10">porte-greffe O39-16</text><text x="17" y="306" font-size="10">donne les gènes Run1 et Rpv1 des</text><text x="17" y="319" font-size="10">variétés résistantes</text><rect x="300" y="210" width="250" height="68" rx="6" fill="#f3e3e3" stroke="#5b1a24"/><text x="307" y="227" font-weight="700" font-size="11" fill="#5b1a24">Sous-genre Euvitis (2n = 38)</text><text x="307" y="241" font-size="10">la « vraie » vigne, de loin le plus important</text><text x="307" y="254" font-size="10">; ses espèces se répartissent en trois</text><text x="307" y="267" font-size="10">bassins</text><path d="M400 176 V193.0 H120 V210" stroke="#625a4e" stroke-width="1.4" fill="none"/><path d="M400 176 V193.0 H425 V210" stroke="#625a4e" stroke-width="1.4" fill="none"/><path d="M230 250 L300 250" stroke="#456e8a" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/><text x="265" y="266" text-anchor="middle" font-size="8.5" font-style="italic" fill="#456e8a">croisements</text><text x="265" y="277" text-anchor="middle" font-size="8.5" font-style="italic" fill="#456e8a">presque stériles</text><text x="265" y="288" text-anchor="middle" font-size="8.5" font-style="italic" fill="#456e8a">(2n = 39)</text><path d="M425 278 V354 M97 370 V354 H463 V370 M280 354 V370" stroke="#625a4e" stroke-width="1.4" fill="none"/><rect x="8" y="370" width="178" height="159" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="15" y="387" font-weight="700" font-size="11" fill="#5b1a24">Amérique du Nord</text><text x="15" y="401" font-size="9.5" font-style="italic" fill="#625a4e">34 espèces selon le livre ;</text><text x="15" y="414" font-size="9.5" font-style="italic" fill="#625a4e">apport : les résistances</text><text x="15" y="427" font-size="10">V. riparia et V. rupestris :</text><text x="15" y="440" font-size="10">sols plutôt acides</text><text x="15" y="453" font-size="10">V. berlandieri : Texas, sols</text><text x="15" y="466" font-size="10">calcaires ; se greffe et</text><text x="15" y="479" font-size="10">s'enracine mal</text><text x="15" y="492" font-size="10">V. labrusca : le concord,</text><text x="15" y="505" font-size="10">longtemps cru pur, a environ un</text><text x="15" y="518" font-size="10">quart à un tiers de vinifera</text><rect x="194" y="370" width="172" height="120" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="201" y="387" font-weight="700" font-size="11" fill="#5b1a24">Asie orientale</text><text x="201" y="401" font-size="9.5" font-style="italic" fill="#625a4e">37 espèces pour le livre</text><text x="201" y="414" font-size="9.5" font-style="italic" fill="#625a4e">(Chine seule) ; apport : le</text><text x="201" y="427" font-size="9.5" font-style="italic" fill="#625a4e">froid</text><text x="201" y="440" font-size="10">V. amurensis : bassin de</text><text x="201" y="453" font-size="10">l'Amour, entre Russie et Chine</text><text x="201" y="466" font-size="10">; l'espèce la plus résistante</text><text x="201" y="479" font-size="10">au froid</text><rect x="374" y="370" width="178" height="159" rx="6" fill="#faf3e0" stroke="#a8843a"/><text x="381" y="387" font-weight="700" font-size="11" fill="#5b1a24">Europe et Proche-Orient</text><text x="381" y="401" font-size="9.5" font-style="italic" fill="#625a4e">une seule espèce ; apport : le</text><text x="381" y="414" font-size="9.5" font-style="italic" fill="#625a4e">vin</text><text x="381" y="427" font-size="10" font-weight="700">V. vinifera</text><text x="381" y="440" font-size="10">subsp. sylvestris : la</text><text x="381" y="453" font-size="10">lambrusque, sauvage,</text><text x="381" y="466" font-size="10">typiquement dioïque, protégée</text><text x="381" y="479" font-size="10">en France depuis 1995</text><text x="381" y="492" font-size="10">subsp. vinifera (sativa dans le</text><text x="381" y="505" font-size="10">livre) : cultivée, typiquement</text><text x="381" y="518" font-size="10">hermaphrodite</text><path d="M97 529 L97 559" stroke="#625a4e" stroke-width="1.4" fill="none"/><path d="M280 490 L280 559" stroke="#625a4e" stroke-width="1.4" fill="none"/><path d="M463 529 L463 559" stroke="#625a4e" stroke-width="1.4" fill="none"/><rect x="8" y="559" width="178" height="120" rx="6" fill="#fff" stroke="#a8843a"/><text x="15" y="576" font-weight="700" font-size="11" fill="#a8843a">Les porte-greffes</text><text x="15" y="590" font-size="10">3309 C, 101-14 : riparia ×</text><text x="15" y="603" font-size="10">rupestris</text><text x="15" y="616" font-size="10">SO4, 161-49 : berlandieri ×</text><text x="15" y="629" font-size="10">riparia</text><text x="15" y="642" font-size="10">110 R, 140 Ru, 1103 P :</text><text x="15" y="655" font-size="10">berlandieri × rupestris</text><text x="15" y="668" font-size="10">41 B : berlandieri × chasselas</text><rect x="194" y="559" width="172" height="55" rx="6" fill="#fff" stroke="#a8843a"/><text x="201" y="576" font-weight="700" font-size="11" fill="#a8843a">Des cépages du froid</text><text x="201" y="590" font-size="10">croisés avec vinifera : rondo,</text><text x="201" y="603" font-size="10">solaris, cabernet severny</text><rect x="374" y="559" width="178" height="68" rx="6" fill="#fff" stroke="#a8843a"/><text x="381" y="576" font-weight="700" font-size="11" fill="#a8843a">Les cépages du vin</text><text x="381" y="590" font-size="10">la domestication de la forme</text><text x="381" y="603" font-size="10">cultivée a fait naître des</text><text x="381" y="616" font-size="10">milliers de cépages</text><text x="280" y="701" text-anchor="middle" font-size="9.5" fill="#625a4e" font-style="italic">Les nombres d'espèces varient selon les auteurs : Wan et al. (2013) en comptent jusqu'à 30</text><text x="280" y="714" text-anchor="middle" font-size="9.5" fill="#625a4e" font-style="italic">en Asie orientale et 28 en Amérique du Nord avec le Mexique.</text></svg>
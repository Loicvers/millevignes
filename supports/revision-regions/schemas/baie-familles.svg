    <text x="174" y="20" font-weight="700" fill="#5b1a24">Peau</text><text x="174" y="34">anthocyanes (rouge), flavonols</text><text x="174" y="47">(jaune), tanins condensés,</text><text x="174" y="60">resvératrol (Handbook)</text>
    <text x="174" y="118" font-weight="700" fill="#5b1a24">Pépins</text><text x="174" y="132">catéchines : beaucoup</text><text x="174" y="145">de tanins condensés</text>

  <g>
    <text x="398" y="30" font-weight="700" fill="#5b1a24">Pulpe</text><text x="398" y="44">acides phénols, incolores</text><text x="398" y="57">et très oxydables</text>
    <text x="398" y="110" font-weight="700" fill="#5b1a24">Jamais dans le raisin</text><text x="398" y="124">ellagitannins : viennent du</text><text x="398" y="137">chêne ou des tanins</text><text x="398" y="150">œnologiques</text>

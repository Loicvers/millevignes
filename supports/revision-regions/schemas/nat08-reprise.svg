<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="170" y="14" font-weight="700" fill="#5b1a24">Pour 100 greffés, combien de plants repris ?</text>
  <g stroke="#d8d0c2"><line x1="170" y1="24" x2="170" y2="104"/><line x1="470" y1="24" x2="470" y2="104" stroke-dasharray="3 3"/></g>
  <g text-anchor="end">
    <text x="162" y="42">FranceAgriMer, 2016</text><text x="162" y="68">FranceAgriMer, 2017</text><text x="162" y="94">Vitisphere, année normale</text>
  </g>
  <rect x="170" y="30" width="195" height="16" fill="#5b1a24"/><text x="372" y="42" fill="#1a1612">65 %</text>
  <rect x="170" y="56" width="207" height="16" fill="#5b1a24"/><text x="384" y="68" fill="#1a1612">69 %</text>
  <rect x="170" y="82" width="180" height="16" fill="#a8843a"/><rect x="350" y="82" width="15" height="16" fill="#a8843a" opacity="0.45"/><text x="372" y="94" fill="#1a1612">60 à 65 %</text>

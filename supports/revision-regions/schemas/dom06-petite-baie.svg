<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Petite baie, grande peau</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe, tailles indicatives</text>
  <circle cx="50" cy="68" r="24" fill="#5b1a24"/><circle cx="50" cy="68" r="18" fill="#faf3e0"/>
  <text x="88" y="58" font-weight="700">Petite baie</text><text x="88" y="73">peu de jus pour</text><text x="88" y="86">beaucoup de peau</text>
  <circle cx="320" cy="68" r="40" fill="#5b1a24"/><circle cx="320" cy="68" r="34" fill="#faf3e0"/>
  <text x="372" y="58" font-weight="700">Grosse baie</text><text x="372" y="73">plus de jus pour</text><text x="372" y="86">la même épaisseur de peau</text>
  <text x="0" y="132" font-size="9.5" fill="#625a4e">Rapport peau et pépins sur jus élevé : couleur intense, tanins fermes.</text>
</svg>

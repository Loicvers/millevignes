  <g text-anchor="middle">
    <text x="100" y="138" font-weight="700" fill="#5b1a24">Traditionnelle</text><text x="100" y="152" font-size="10" fill="#625a4e">dans la bouteille</text>
    <text x="280" y="138" font-weight="700" fill="#5b1a24">Ancestrale</text><text x="280" y="152" font-size="10" fill="#625a4e">bouteille, fermentation à finir</text>

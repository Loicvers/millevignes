  <path d="M273 34 H287 V56 Q300 62 300 74 V108 Q300 114 294 114 H266 Q260 114 260 108 V74 Q260 62 273 56 Z" fill="#faf3e0" stroke="#5b1a24" stroke-width="1.5"/>

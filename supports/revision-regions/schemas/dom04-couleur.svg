  <g font-size="10" text-anchor="middle">
    <rect x="170" y="38" width="90" height="20" rx="4" fill="#5b1a24"/><text x="215" y="52" fill="#faf3e0">VvMYBA1</text>
    <rect x="266" y="38" width="90" height="20" rx="4" fill="#5b1a24"/><text x="311" y="52" fill="#faf3e0">VvMYBA2</text>
    <rect x="170" y="66" width="90" height="20" rx="4" fill="#d8d0c2"/><text x="215" y="80" fill="#625a4e">inactif</text>
    <rect x="266" y="66" width="90" height="20" rx="4" fill="#d8d0c2"/><text x="311" y="80" fill="#625a4e">inactif</text>
    <rect x="170" y="102" width="90" height="20" rx="4" fill="#d8d0c2"/><text x="215" y="116" fill="#625a4e">inactif</text>
    <rect x="266" y="102" width="90" height="20" rx="4" fill="#d8d0c2"/><text x="311" y="116" fill="#625a4e">inactif</text>
    <rect x="170" y="130" width="90" height="20" rx="4" fill="#d8d0c2"/><text x="215" y="144" fill="#625a4e">inactif</text><rect x="266" y="130" width="90" height="20" rx="4" fill="#d8d0c2"/><text x="311" y="144" fill="#625a4e">inactif</text>
  </g>
  <g font-size="10"><text x="372" y="56">au moins une copie active</text><text x="372" y="70">→ anthocyanes fabriquées</text><text x="372" y="118">les deux copies inactives</text><text x="372" y="134">→ pas d’anthocyanes</text></g>

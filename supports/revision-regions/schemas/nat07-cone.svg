<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Où l'on coupe compte</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <rect x="10" y="30" width="40" height="80" fill="#faf3e0" stroke="#625a4e"/>
  <rect x="50" y="52" width="30" height="16" fill="#faf3e0" stroke="#625a4e"/>
  <path d="M80 52 L80 68 L22 60 Z" fill="#c9bfae" stroke="#a8843a"/>
  <line x1="80" y1="49" x2="80" y2="71" stroke="#5b1a24" stroke-width="3"/>
  <text x="100" y="62" font-size="10" fill="#625a4e">plaie près du tronc : le bois sec</text>
  <text x="100" y="75" font-size="10" fill="#625a4e">la zone sèche gagne le tronc</text>
  <rect x="300" y="30" width="40" height="80" fill="#faf3e0" stroke="#625a4e"/>
  <rect x="340" y="52" width="120" height="16" fill="#faf3e0" stroke="#625a4e"/>
  <path d="M460 52 L460 68 L430 60 Z" fill="#c9bfae" stroke="#a8843a"/>
  <line x1="460" y1="49" x2="460" y2="71" stroke="#5b1a24" stroke-width="3"/>
  <text x="350" y="92" font-size="10" fill="#625a4e">plaie éloignée du tronc : la zone sèche reste</text>
  <text x="350" y="105" font-size="10" fill="#625a4e">à l'extrémité, le tronc est épargné</text>
  <text x="280" y="140" text-anchor="middle" font-size="10">zone grise = cône de dessiccation ; trait rouge = coupe</text>
</svg>

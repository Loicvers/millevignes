<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">L'étude de Turin (2020), nord-ouest de l'Italie</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="28" width="131" height="76" rx="6"/><rect x="143" y="28" width="131" height="76" rx="6"/><rect x="286" y="28" width="131" height="76" rx="6"/><rect x="429" y="28" width="131" height="76" rx="6" stroke="#a8843a"/>
  </g>
  <g text-anchor="middle">
    <text x="65" y="56" font-weight="700" font-size="17" fill="#5b1a24">227</text><text x="65" y="74" font-size="10">cépages anciens</text><text x="65" y="88" font-size="10" fill="#625a4e">analysés</text>
    <text x="208" y="56" font-weight="700" font-size="17" fill="#5b1a24">4</text><text x="208" y="74" font-size="10">régions</text><text x="208" y="88" font-size="9.5" fill="#625a4e">Piémont, Aoste, Ligurie,</text><text x="208" y="99" font-size="9.5" fill="#625a4e">Lombardie</text>
    <text x="351" y="56" font-weight="700" font-size="17" fill="#5b1a24">5</text><text x="351" y="74" font-size="10">cépages fondateurs</text><text x="351" y="88" font-size="10" fill="#625a4e">mis en évidence</text>
    <text x="494" y="52" font-weight="700" font-size="11" fill="#5b1a24">Parents disparus</text><text x="494" y="72" font-size="10">reconstitués à partir</text><text x="494" y="86" font-size="10">de leurs descendants</text>
  </g>
  <text x="0" y="128" font-size="10" fill="#625a4e">Les deux parents du nebbiolo, eux, restent inconnus.</text>

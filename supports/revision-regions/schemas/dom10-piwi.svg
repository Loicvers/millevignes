<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">PiWi : un sigle allemand</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="32" width="150" height="62" rx="6"/>
    <rect x="195" y="32" width="190" height="62" rx="6"/>
    <rect x="430" y="32" width="130" height="62" rx="6" stroke="#a8843a"/>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="75" y="58" font-weight="700" font-size="13">Pilz</text><text x="75" y="76" fill="#625a4e">le champignon</text>
    <text x="290" y="58" font-weight="700" font-size="13">widerstandsfähig</text><text x="290" y="76" fill="#625a4e">qui résiste</text>
    <text x="495" y="58" font-weight="700" font-size="15" fill="#5b1a24">PiWi</text><text x="495" y="76" fill="#625a4e">cépage résistant</text>
    <text x="172" y="68" font-size="18" fill="#a8843a" font-weight="700">+</text>
    <text x="407" y="68" font-size="18" fill="#a8843a" font-weight="700">=</text>
  </g>
  <text x="0" y="114" font-size="9.5" fill="#625a4e">On dit « variétés résistantes » ou PiWi plutôt qu'« hybrides ».</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">L'année du vigneron, dans l'ordre</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe : durées non à l'échelle</text>
  <g font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="0" y="32" width="100" height="26" fill="#456e8a"/><text x="50" y="49">Hiver</text>
    <rect x="100" y="32" width="100" height="26" fill="#456e8a"/><text x="150" y="49">Avant fleur</text>
    <rect x="200" y="32" width="120" height="26" fill="#5c7a4f"/><text x="260" y="49">Printemps</text>
    <rect x="320" y="32" width="120" height="26" fill="#a8843a"/><text x="380" y="49">Jusqu'en été</text>
    <rect x="440" y="32" width="120" height="26" fill="#5b1a24"/><text x="500" y="49">Fin d'été, automne</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1a1612">
    <text x="50" y="76">taille</text>
    <text x="150" y="76">tirage des bois,</text><text x="150" y="89">liage</text>
    <text x="260" y="76">ébourgeonnage</text><text x="260" y="89">(après le gel)</text>
    <text x="380" y="76">relevage,</text><text x="380" y="89">rognage</text>
    <text x="500" y="76">vendanges</text>
  </g>
  <text x="280" y="118" text-anchor="middle" font-size="10" fill="#625a4e">la taille ouvre l'année, les vendanges la closent</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 125" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Les trois proles de Negrul, d'ouest en est</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="30" width="170" height="56" rx="6"/>
    <rect x="195" y="30" width="170" height="56" rx="6"/>
    <rect x="390" y="30" width="170" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="85" y="52" font-weight="700" fill="#5b1a24">Occidentalis</text><text x="85" y="68">Europe de l'Ouest</text>
    <text x="280" y="50" font-weight="700" fill="#5b1a24">Pontica</text><text x="280" y="63">Géorgie, Balkans,</text><text x="280" y="76">Hongrie, Grèce</text>
    <text x="475" y="50" font-weight="700" fill="#5b1a24">Orientalis</text><text x="475" y="63">Arménie, Iran,</text><text x="475" y="76">Afghanistan…</text>
  </g>
  <path d="M0 102 H548" stroke="#625a4e" stroke-width="1.5"/><path d="M542 97 L548 102 L542 107" stroke="#625a4e" stroke-width="1.5" fill="none"/>
  <text x="0" y="118" font-size="9.5" fill="#625a4e">ouest</text><text x="560" y="118" text-anchor="end" font-size="9.5" fill="#625a4e">est</text>
</svg>

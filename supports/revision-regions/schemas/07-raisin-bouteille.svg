<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 125" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <defs><marker id="m07-raisin-bouteille" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#625a4e"/></marker></defs>
  <rect x="10" y="10" width="225" height="62" rx="6" fill="#faf3e0" stroke="#a8843a" stroke-width="1.5"/>
  <text x="22" y="28" font-weight="700" fill="#a8843a">À la vendange</text>
  <text x="22" y="44" font-size="10.5">raisin surmûri, récolté à la main,</text>
  <text x="22" y="58" font-size="10.5">jamais enrichi</text>
  <path d="M240 41 H322" stroke="#625a4e" marker-end="url(#m07-raisin-bouteille)"/>
  <text x="281" y="34" text-anchor="middle" font-size="10" fill="#625a4e">cave</text>
  <rect x="325" y="10" width="225" height="62" rx="6" fill="#faf3e0" stroke="#d8d0c2" stroke-width="1.5"/>
  <text x="337" y="28" font-weight="700" fill="#625a4e">Dans la bouteille</text>
  <text x="337" y="44" font-size="10.5">sucre restant : ?</text>
  <text x="337" y="58" font-size="10.5" fill="#625a4e">la mention n'en dit rien</text>
  <text x="122" y="94" text-anchor="middle" font-size="10.5" fill="#a8843a" font-weight="700">VT ou SGN décrit ceci</text>
  <text x="437" y="94" text-anchor="middle" font-size="10.5" fill="#5b1a24" font-weight="700">à lire sur la fiche technique</text>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#625a4e">schéma de principe</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a8843a"/></marker></defs>
  <text x="0" y="14" font-weight="700" fill="#5b1a24">ATA : ce qui protège, ce qui aggrave</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="0" y="26" width="200" height="94" rx="4"/><rect x="360" y="26" width="200" height="94" rx="4"/><rect x="224" y="26" width="112" height="94" rx="4"/></g>
  <text x="10" y="44" font-weight="700" fill="#5c7a4f">Préserve le fruité</text>
  <g font-size="10"><text x="10" y="64">élevage sur lies totales</text><text x="10" y="80">fûts usagés</text></g>
  <text x="370" y="44" font-weight="700" fill="#5b1a24">Aggrave</text>
  <g font-size="10"><text x="370" y="64">bois neuf sans lies</text><text x="370" y="84" fill="#625a4e">associé aussi : vigne stressée</text><text x="370" y="98" fill="#625a4e">(lien débattu)</text></g>
  <text x="280" y="44" text-anchor="middle" font-weight="700" fill="#456e8a">Blanc</text>
  <g font-size="10" text-anchor="middle"><text x="280" y="64">fruité des vins</text><text x="280" y="78">jeunes</text><text x="280" y="98" fill="#a8843a">→ naphtaline,</text><text x="280" y="112" fill="#a8843a">cire, acacia…</text></g>
  <path d="M204 60 H220" stroke="#5c7a4f" stroke-width="1.5" marker-end="url(#a)"/><path d="M356 60 H340" stroke="#5b1a24" stroke-width="1.5" marker-end="url(#a)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Vin Méthode Nature : où se place le SO2</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="30" width="125" height="62" rx="6"/>
    <rect x="145" y="30" width="125" height="62" rx="6"/>
    <rect x="290" y="30" width="125" height="62" rx="6" stroke="#a8843a"/>
    <rect x="435" y="30" width="125" height="62" rx="6"/>
  </g>
  <g stroke="#625a4e" stroke-width="1.5" fill="none"><path d="M127 61 H143"/><path d="M272 61 H288"/><path d="M417 61 H433"/></g>
  <g text-anchor="middle" font-size="10.5">
    <text x="62" y="52" font-weight="700">Vendange</text><text x="62" y="67">puis début de</text><text x="62" y="80">vinification</text>
    <text x="207" y="52" font-weight="700">Fermentation</text><text x="207" y="67">aucun SO2</text><text x="207" y="80">ajouté</text>
    <text x="352" y="52" font-weight="700" fill="#5b1a24">Après la fermentation</text><text x="352" y="67">SO2 permis :</text><text x="352" y="80" fill="#5b1a24" font-weight="700">moins de 30 mg/l *</text>
    <text x="497" y="52" font-weight="700">Contrôle</text><text x="497" y="67">externe</text><text x="497" y="80" font-size="9.5" fill="#625a4e">(modalités variables)</text>
  </g>
  <text x="0" y="116" font-size="9.5" fill="#625a4e">* SO2 total ou sulfites ajoutés : les sources divergent sur le sens exact du seuil.</text>

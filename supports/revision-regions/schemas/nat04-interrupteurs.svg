<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Deux interrupteurs de couleur dans la pellicule (schéma de principe)</text>
  <g font-size="10" text-anchor="middle">
    <text x="95" y="38" fill="#625a4e">VvMybA1</text><text x="175" y="38" fill="#625a4e">VvMybA2</text>
    <rect x="70" y="46" width="50" height="22" rx="11" fill="#5b1a24"/><circle cx="108" cy="57" r="8" fill="#faf3e0"/>
    <rect x="150" y="46" width="50" height="22" rx="11" fill="#5b1a24"/><circle cx="188" cy="57" r="8" fill="#faf3e0"/>
    <text x="135" y="90" fill="#5b1a24" font-weight="700">allumés : pellicule colorée</text>
    <rect x="300" y="46" width="50" height="22" rx="11" fill="#d8d0c2"/><circle cx="312" cy="57" r="8" fill="#faf3e0" stroke="#625a4e"/>
    <rect x="380" y="46" width="50" height="22" rx="11" fill="#d8d0c2"/><circle cx="392" cy="57" r="8" fill="#faf3e0" stroke="#625a4e"/>
    <text x="325" y="38" fill="#625a4e">VvMybA1</text><text x="405" y="38" fill="#625a4e">VvMybA2</text>
    <text x="365" y="90" fill="#625a4e" font-weight="700">éteints : raisin blanc</text>
  </g>
  <text x="0" y="118" font-size="10" fill="#625a4e">Gris et roses : mutations partielles. Teinturiers : la pulpe est colorée aussi.</text>
</svg>

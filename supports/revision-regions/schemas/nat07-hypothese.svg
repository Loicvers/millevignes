<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Une hypothèse, pas un fait établi</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">hypothèse rapportée par Lepeltier (A. Carbonneau)</text>
  <rect x="0" y="34" width="170" height="44" rx="6" fill="#faf3e0" stroke="#a8843a"/>
  <text x="85" y="53" text-anchor="middle">Bourrelet de greffe</text><text x="85" y="68" text-anchor="middle" font-size="10" fill="#625a4e">retiendrait des sucres en haut</text>
  <path d="M170 56 H215" stroke="#1a1612" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1a1612"/></marker></defs>
  <rect x="220" y="30" width="340" height="36" rx="6" fill="#faf3e0" stroke="#5c7a4f"/>
  <text x="230" y="46" font-weight="700" fill="#5c7a4f">Merlot</text><text x="230" y="60" font-size="10" fill="#625a4e">noue mal : fructifierait mieux et s'étendrait</text>
  <rect x="220" y="76" width="340" height="36" rx="6" fill="#faf3e0" stroke="#5b1a24"/>
  <text x="230" y="92" font-weight="700" fill="#5b1a24">Malbec</text><text x="230" y="106" font-size="10" fill="#625a4e">coulure par excès de vigueur : reculerait</text>
  <text x="280" y="138" text-anchor="middle" font-size="10">aucune source indépendante trouvée pour confirmer</text>
</svg>

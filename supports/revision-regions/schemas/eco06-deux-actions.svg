<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <rect x="10" y="10" width="250" height="96" rx="6" fill="#faf3e0" stroke="#a8843a"/>
  <text x="135" y="30" text-anchor="middle" font-weight="700" fill="#5b1a24">Action directe positive</text>
  <text x="135" y="50" text-anchor="middle" font-size="10">occidentale, interventionniste</text>
  <text x="135" y="72" text-anchor="middle" font-size="10" fill="#625a4e">réflexe critiqué par Lepeltier :</text>
  <text x="135" y="88" text-anchor="middle" font-size="10.5" font-weight="700">« à un problème, une molécule »</text>
  <rect x="300" y="10" width="250" height="96" rx="6" fill="#faf3e0" stroke="#5c7a4f"/>
  <text x="425" y="30" text-anchor="middle" font-weight="700" fill="#5c7a4f">Action indirecte négative</text>
  <text x="425" y="50" text-anchor="middle" font-size="10">associée à l'Asie selon Lepeltier (Haudricourt, 1962)</text>
  <text x="425" y="72" text-anchor="middle" font-size="10" fill="#625a4e">à rapprocher d'une conduite</text>
  <text x="425" y="88" text-anchor="middle" font-size="10.5" font-weight="700">multifactorielle qui accompagne la vigne</text>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#a8843a" font-weight="700">ou</text>
  <text x="10" y="128" font-size="10" fill="#625a4e">Le rapprochement avec Fukuoka (sans machine, pesticide, engrais ni labour) est celui du livre, pas de Haudricourt.</text>
</svg>

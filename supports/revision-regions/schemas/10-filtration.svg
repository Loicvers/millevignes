<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a8843a"/></marker></defs>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="10" y="10" width="110" height="48" rx="4"/><rect x="165" y="10" width="190" height="48" rx="4"/><rect x="400" y="10" width="150" height="48" rx="4"/></g>
  <text x="20" y="38" font-weight="700" fill="#5b1a24">Vin trouble</text>
  <text x="175" y="28" font-weight="700" fill="#5b1a24">En profondeur</text><text x="175" y="44" font-size="10">diatomées ou cellulose : lit poreux</text>
  <text x="410" y="28" font-weight="700" fill="#5b1a24">Membrane</text><text x="410" y="44" font-size="10">retient levures et bactéries</text>

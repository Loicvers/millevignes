  <text x="378" y="76" text-anchor="middle" font-size="10" fill="#625a4e">avant la mise</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="10" y="88" width="265" height="44" rx="4"/><rect x="285" y="88" width="265" height="44" rx="4"/></g>
  <text x="20" y="106" font-weight="700" fill="#456e8a">Tangentielle</text><text x="20" y="122" font-size="10">le vin longe la membrane : moins de colmatage</text>
  <text x="295" y="106" font-weight="700" fill="#456e8a">Centrifugeuse à assiettes</text><text x="295" y="122" font-size="10">force centrifuge, sans média filtrant</text>

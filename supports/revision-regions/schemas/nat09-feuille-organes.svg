<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 126" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Pour Goethe : six organes, un seul organe de base</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <rect x="190" y="24" width="180" height="26" rx="13" fill="#5c7a4f"/>
  <text x="280" y="41" text-anchor="middle" fill="#faf3e0" font-weight="700">l’organe de base : la feuille</text>
  <g stroke="#a8843a" stroke-width="1.2" fill="none">
    <path d="M250 50 L40 84"/><path d="M262 50 L136 84"/><path d="M274 50 L232 84"/><path d="M286 50 L328 84"/><path d="M298 50 L424 84"/><path d="M310 50 L520 84"/>
  </g>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="0" y="84" width="80" height="22" rx="4"/><rect x="96" y="84" width="80" height="22" rx="4"/><rect x="192" y="84" width="80" height="22" rx="4"/><rect x="288" y="84" width="80" height="22" rx="4"/><rect x="384" y="84" width="80" height="22" rx="4"/><rect x="480" y="84" width="80" height="22" rx="4"/></g>
  <g font-size="10" text-anchor="middle"><text x="40" y="99">cotylédons</text><text x="136" y="99">feuilles</text><text x="232" y="99">sépales</text><text x="328" y="99">pétales</text><text x="424" y="99">étamines</text><text x="520" y="99">fruits</text></g>
  <text x="280" y="122" text-anchor="middle" font-size="10" fill="#625a4e">des variations, qui alternent expansion et contraction</text>
</svg>

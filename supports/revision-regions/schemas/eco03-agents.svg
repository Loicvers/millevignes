<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <rect x="0" y="4" width="290" height="116" rx="6" fill="#faf3e0" stroke="#5c7a4f"/>
  <text x="145" y="24" text-anchor="middle" font-weight="700" fill="#5c7a4f">Alliés cités par le livre (biocontrôle)</text>
  <g font-style="italic" text-anchor="middle"><text x="145" y="50">Trichoderma</text><text x="145" y="68">Bacillus pumilus</text><text x="145" y="86">Metschnikowia fructicola</text><text x="145" y="104">Willaertia magna</text></g>
  <rect x="310" y="4" width="250" height="116" rx="6" fill="#faf3e0" stroke="#5b1a24"/>
  <text x="435" y="24" text-anchor="middle" font-weight="700" fill="#5b1a24">Agents de maladies, pas des champignons</text>
  <g text-anchor="middle"><text x="435" y="56"><tspan font-style="italic">Xylella fastidiosa</tspan> → maladie de Pierce</text><text x="435" y="78">un phytoplasme → flavescence dorée</text></g>
  <text x="435" y="104" text-anchor="middle" font-size="10" fill="#625a4e">deux maladies, deux agents différents</text>
</svg>

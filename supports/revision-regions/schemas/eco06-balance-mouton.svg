<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="280" y="16" text-anchor="middle" font-weight="700" fill="#5b1a24">Le pâturage dans la vigne : le bilan de l'étude de Niles et al. (2018, Marlborough)</text>
  <rect x="10" y="30" width="300" height="86" rx="6" fill="#faf3e0" stroke="#5c7a4f"/>
  <text x="160" y="50" text-anchor="middle" font-weight="700" fill="#5c7a4f">Avantages</text>
  <text x="160" y="70" text-anchor="middle" font-size="10">tonte · herbicides · azote</text>
  <text x="160" y="86" text-anchor="middle" font-size="10">fioul · effeuillage</text>
  <rect x="350" y="30" width="200" height="86" rx="6" fill="#faf3e0" stroke="#a8843a"/>
  <text x="450" y="50" text-anchor="middle" font-weight="700" fill="#a8843a">Inconvénients</text>
  <text x="450" y="70" text-anchor="middle" font-size="10">dégâts sur les fils</text>
  <text x="450" y="86" text-anchor="middle" font-size="10">et sur les tuyaux</text>
  <text x="330" y="78" text-anchor="middle" font-size="16" fill="#5b1a24" font-weight="700">&gt;</text>
  <text x="10" y="138" font-size="10" fill="#625a4e">Selon l'étude, les avantages dépassent les inconvénients ; schéma de principe, sans mesures.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <rect x="10" y="40" width="108" height="44" rx="4" fill="#faf3e0" stroke="#a8843a" stroke-width="1.2"/>
  <text x="64" y="58" text-anchor="middle" font-weight="700" fill="#5b1a24">Un marc</text>
  <text x="64" y="74" text-anchor="middle" font-size="10" fill="#625a4e">4 000 kg de raisins</text>
  <path d="M122 62 H140" stroke="#a8843a" stroke-width="1.2"/><path d="M138 57 L146 62 L138 67 Z" fill="#a8843a"/>
  <path d="M150 34 V28 H540 V34" fill="none" stroke="#625a4e" stroke-width="1"/>
  <text x="345" y="22" text-anchor="middle" font-size="10" fill="#625a4e">moût débourbé : 2 550 litres au plus</text>
  <rect x="150" y="40" width="320" height="44" fill="#5b1a24"/>
  <rect x="470" y="40" width="70" height="44" fill="#a8843a"/>
  <g text-anchor="middle" fill="#faf3e0" font-weight="700"><text x="310" y="66">cuvée, 2 050 L</text></g>
  <g text-anchor="middle" fill="#1a1612" font-weight="700"><text x="505" y="58">taille</text><text x="505" y="73" font-weight="400">500 L</text></g>
  <text x="150" y="104" font-size="10" fill="#625a4e">Cuvée et taille sont vinifiées séparément. Vient ensuite la rebêche,</text>
  <text x="150" y="118" font-size="10" fill="#625a4e">jus grossier de fin de pressée (schéma de principe, proportions respectées).</text>

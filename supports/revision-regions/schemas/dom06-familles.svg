<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">De 3 proles à 16 groupes français</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="30" width="170" height="62" rx="6"/>
    <rect x="195" y="30" width="170" height="62" rx="6"/>
    <rect x="390" y="30" width="170" height="62" rx="6" stroke="#a8843a"/>
  </g>
  <g stroke="#625a4e" stroke-width="1.5" fill="none"><path d="M172 61 H193"/><path d="M367 61 H388"/></g>
  <g text-anchor="middle" font-size="10.5">
    <text x="85" y="52" font-weight="700">1946, Negrul</text><text x="85" y="67">3 grands groupes</text><text x="85" y="80">(les proles)</text>
    <text x="280" y="52" font-weight="700">1948, Levadoux</text><text x="280" y="67">les sortotypes, pour</text><text x="280" y="80">l'Europe de l'Ouest</text>
    <text x="475" y="52" font-weight="700" fill="#5b1a24">1999, Bisson</text><text x="475" y="67">16 groupes</text><text x="475" y="80">pour la France</text>
  </g>
  <text x="0" y="112" font-size="9.5" fill="#625a4e">Chaque groupe porte le nom de son cépage le plus représentatif.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <line x1="70" y1="42" x2="490" y2="42" stroke="#d8d0c2" stroke-width="2"/>
  <g fill="#a8843a"><circle cx="70" cy="42" r="6"/><circle cx="175" cy="42" r="6"/><circle cx="280" cy="42" r="6"/><circle cx="385" cy="42" r="6"/><circle cx="490" cy="42" r="6"/></g>
  <g text-anchor="middle">
    <text x="70" y="72" font-weight="700" fill="#5b1a24">Blanc sec</text>
    <text x="70" y="86" fill="#625a4e">cuve neutre, fruit</text>
    <text x="175" y="72" font-weight="700" fill="#5b1a24">Liquoreux</text>
    <text x="175" y="86" fill="#625a4e">tries successives</text>
    <text x="280" y="72" font-weight="700" fill="#5b1a24">Effervescent</text>
    <text x="280" y="86" fill="#625a4e">toutes méthodes</text>
    <text x="385" y="72" font-weight="700" fill="#5b1a24">Rosé</text>
    <text x="385" y="86" fill="#625a4e">sec ou tendre</text>
    <text x="490" y="72" font-weight="700" fill="#5b1a24">Rouge</text>
    <text x="490" y="86" fill="#625a4e">léger ou de garde</text>
    <text x="280" y="20" fill="#625a4e" font-size="10">un seul vignoble, cinq familles de vins</text>
  </g>
</svg>

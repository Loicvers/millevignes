<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Trois étapes pour reconnaître un cépage</text>
  <g stroke="#d8d0c2" fill="#faf3e0">
    <rect x="0" y="30" width="170" height="62" rx="6"/>
    <rect x="195" y="30" width="170" height="62" rx="6"/>
    <rect x="390" y="30" width="170" height="62" rx="6" stroke="#a8843a"/>
  </g>
  <g stroke="#625a4e" stroke-width="1.5" fill="none"><path d="M172 61 H193"/><path d="M367 61 H388"/></g>
  <g text-anchor="middle" font-size="10.5">
    <text x="85" y="52" font-weight="700">Décrire</text><text x="85" y="67">planches et textes</text><text x="85" y="80">(Viala et Vermorel)</text>
    <text x="280" y="52" font-weight="700">Mesurer</text><text x="280" y="67">nervures, angles</text><text x="280" y="80">(ampélométrie, OIV)</text>
    <text x="475" y="52" font-weight="700" fill="#5b1a24">Lire l'ADN</text><text x="475" y="67">microsatellites</text><text x="475" y="80">(SSR)</text>
  </g>
  <text x="0" y="112" font-size="9.5" fill="#625a4e">Chaque étape corrige la précédente, sans régler la question du nom.</text>
</svg>

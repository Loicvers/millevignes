<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <path d="M20 58 H530" stroke="#625a4e" stroke-width="1.5"/><path d="M530 52 L540 58 L530 64" fill="none" stroke="#625a4e" stroke-width="1.5"/>
  <g fill="#a8843a"><circle cx="85" cy="58" r="5"/><circle cx="280" cy="58" r="5"/></g><circle cx="475" cy="58" r="5" fill="#5b1a24"/>
  <g text-anchor="middle">
    <text x="85" y="36" font-weight="700" fill="#5b1a24">Les Vitacées</text>
    <text x="85" y="80" font-size="10">Crétacé, vers 100 Ma</text><text x="85" y="93" font-size="10">(selon le livre)</text>
    <text x="280" y="36" font-weight="700" fill="#5b1a24">Graines de Vitacées</text>
    <text x="280" y="80" font-size="10">Inde, Crétacé supérieur,</text><text x="280" y="93" font-size="10">vers 66 Ma</text>
    <text x="475" y="36" font-weight="700" fill="#5b1a24">Feuille de Sézanne</text>
    <text x="475" y="80" font-size="10">fin du Paléocène, 59 à 56 Ma</text><text x="475" y="93" font-size="10">(56 Ma pour le livre)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 118" font-family="Inter, sans-serif" font-size="10.5" fill="#1a1612">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#faf3e0"/><stop offset="1" stop-color="#5b1a24"/></linearGradient></defs>

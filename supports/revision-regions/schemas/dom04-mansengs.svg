<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5c7a4f"/><stop offset="1" stop-color="#a8843a"/></linearGradient></defs>
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Où se placent les mansengs ?</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe : positions indicatives</text>
  <rect x="0" y="40" width="560" height="10" rx="5" fill="url(#g)"/>
  <g fill="#1a1612"><circle cx="30" cy="45" r="7" stroke="#faf3e0" stroke-width="2"/><circle cx="280" cy="45" r="7" stroke="#faf3e0" stroke-width="2"/><circle cx="530" cy="45" r="7" stroke="#faf3e0" stroke-width="2"/></g>
  <g font-weight="700"><text x="0" y="72" fill="#5c7a4f">Lambrusques</text><text x="280" y="72" text-anchor="middle" fill="#5b1a24">Famille des mansengs</text><text x="560" y="72" text-anchor="end" fill="#a8843a">Pinot-savagnin</text></g>
  <g font-size="10" fill="#625a4e"><text x="0" y="86">de France et d’Allemagne</text><text x="280" y="86" text-anchor="middle">gros, petit, riesling bleu</text><text x="560" y="86" text-anchor="end">cépages cultivés</text></g>
  <text x="280" y="108" text-anchor="middle" font-size="10">sauvage ← à mi-chemin → cultivé</text>
</svg>

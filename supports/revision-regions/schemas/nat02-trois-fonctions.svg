<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Trois fonctions de la feuille</text>
  <rect x="0" y="24" width="176" height="108" rx="8" fill="#faf3e0" stroke="#5c7a4f"/>
  <text x="88" y="42" text-anchor="middle" font-weight="700" fill="#5c7a4f">Photosynthèse</text>
  <g font-size="10" text-anchor="middle"><text x="88" y="60">Fabrique des sucres,</text><text x="88" y="73">des acides aminés, des lipides,</text><text x="88" y="86">puis des composés secondaires :</text><text x="88" y="99">polyphénols, anthocyanes,</text><text x="88" y="112">arômes</text></g>
  <rect x="192" y="24" width="176" height="108" rx="8" fill="#faf3e0" stroke="#5b1a24"/>
  <text x="280" y="42" text-anchor="middle" font-weight="700" fill="#5b1a24">Respiration</text>
  <g font-size="10" text-anchor="middle"><text x="280" y="60">Brûle des sucres pour</text><text x="280" y="73">fournir l'énergie.</text><text x="280" y="92">Les jeunes feuilles respirent</text><text x="280" y="105">le plus (selon Lepeltier).</text></g>
  <rect x="384" y="24" width="176" height="108" rx="8" fill="#faf3e0" stroke="#456e8a"/>
  <text x="472" y="42" text-anchor="middle" font-weight="700" fill="#456e8a">Transpiration</text>
  <g font-size="10" text-anchor="middle"><text x="472" y="62">Elle dépend de :</text><text x="472" y="79">la lumière,</text><text x="472" y="92">l'humidité de l'air,</text><text x="472" y="105">l'eau disponible.</text></g>
</svg>

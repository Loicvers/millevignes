<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <rect x="10" y="6" width="540" height="164" rx="10" fill="#faf3e0" stroke="#a8843a" stroke-width="1.5"/>
  <text x="24" y="28" font-weight="700" fill="#5b1a24">Cépage : grenache</text>
  <text x="170" y="28" fill="#625a4e" font-size="10">un ensemble de clones assez proches pour porter le même nom</text>
  <g fill="#fff" stroke="#456e8a" stroke-width="1.2">
    <rect x="26" y="40" width="120" height="58" rx="6"/>
    <rect x="158" y="40" width="120" height="122" rx="6"/>
    <rect x="290" y="40" width="120" height="58" rx="6"/>
    <rect x="422" y="40" width="120" height="58" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="86" y="58" fill="#625a4e" font-size="10">Variété</text><text x="86" y="76" font-weight="700">grenache noir</text>
    <text x="218" y="58" fill="#625a4e" font-size="10">Variété</text><text x="218" y="76" font-weight="700">grenache blanc</text>
    <text x="350" y="58" fill="#625a4e" font-size="10">Variété</text><text x="350" y="76" font-weight="700">grenache gris</text>
    <text x="482" y="58" fill="#625a4e" font-size="10">Variété</text><text x="482" y="76" font-weight="700">lladoner pelut</text>
  </g>
  <rect x="168" y="104" width="100" height="48" rx="6" fill="#fff" stroke="#5b1a24" stroke-width="1.2"/>
  <g text-anchor="middle"><text x="218" y="124" fill="#625a4e" font-size="10">Clone</text><text x="218" y="142" font-weight="700" fill="#5b1a24">n° 141</text></g>
  <text x="290" y="130" fill="#625a4e" font-size="10">schéma de principe : chaque niveau</text>
  <text x="290" y="143" fill="#625a4e" font-size="10">contient le suivant, du plus large au plus fin</text>
</svg>

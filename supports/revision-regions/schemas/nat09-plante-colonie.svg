<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <text x="0" y="14" font-weight="700" fill="#5b1a24">Animal et plante : deux façons d’être un tout (Hallé)</text><text x="560" y="14" text-anchor="end" font-size="9.5" font-style="italic" fill="#625a4e">schéma de principe</text>
  <path d="M280 26 V146" stroke="#d8d0c2"/>
  <text x="0" y="40" font-weight="700" fill="#625a4e">Animal</text>
  <rect x="20" y="56" width="150" height="40" rx="20" fill="#faf3e0" stroke="#625a4e"/>
  <circle cx="60" cy="76" r="9" fill="#5b1a24"/>
  <text x="76" y="80" font-size="10" fill="#5b1a24">organes vitaux</text>
  <path d="M158 48 V104" stroke="#1a1612" stroke-dasharray="4 3"/>
  <text x="0" y="122" font-size="10">des organes vitaux centralisés</text>
  <text x="0" y="136" font-size="10">coupé en deux : il meurt</text>
  <text x="300" y="40" font-weight="700" fill="#5c7a4f">Plante</text>
  <g stroke="#5c7a4f" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M310 100 H410"/>
    <path d="M325 100 V78 M325 90 L315 80 M325 90 L335 80"/>
    <path d="M360 100 V78 M360 90 L350 80 M360 90 L370 80"/>
    <path d="M395 100 V78 M395 90 L385 80 M395 90 L405 80"/>
  </g>
  <path d="M427 56 V104" stroke="#1a1612" stroke-dasharray="4 3"/>
  <path d="M445 100 H478 M462 100 V78 M462 90 L452 80 M462 90 L472 80" stroke="#a8843a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="496" y="85" font-size="10" fill="#a8843a" font-weight="700">bouture</text>
  <text x="496" y="98" font-size="10" fill="#a8843a">= plante entière</text>
  <text x="300" y="122" font-size="10">le même motif répété, sans centre vital</text>
  <text x="300" y="136" font-size="10">coupée : elle se multiplie</text>
</svg>

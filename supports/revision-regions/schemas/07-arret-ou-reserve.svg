<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="10.5" fill="#1a1612">
  <defs><marker id="m07-arret-ou-reserve" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#625a4e"/></marker></defs>
  <text x="10" y="13" font-weight="700" fill="#5b1a24">Arrêt de la fermentation</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="10" y="20" width="120" height="36" rx="5"/><rect x="150" y="20" width="120" height="36" rx="5" stroke="#5b1a24" stroke-width="1.5"/><rect x="290" y="20" width="120" height="36" rx="5"/><rect x="430" y="20" width="120" height="36" rx="5"/></g>
  <g text-anchor="middle">
    <text x="70" y="35">Moût en</text><text x="70" y="48">fermentation</text>
    <text x="210" y="35" fill="#5b1a24" font-weight="700">Arrêt avant la fin</text><text x="210" y="48">froid, filtration…</text>
    <text x="350" y="35">Retirer les levures,</text><text x="350" y="48">stabiliser</text>
    <text x="490" y="35">Vin avec du</text><text x="490" y="48">sucre résiduel</text>
  </g>
  <g stroke="#625a4e" marker-end="url(#m07-arret-ou-reserve)"><path d="M131 38 H147"/><path d="M271 38 H287"/><path d="M411 38 H427"/></g>
  <text x="10" y="86" font-weight="700" fill="#a8843a">Süssreserve</text>
  <g fill="#faf3e0" stroke="#d8d0c2"><rect x="10" y="93" width="120" height="36" rx="5"/><rect x="150" y="93" width="120" height="36" rx="5" stroke="#a8843a" stroke-width="1.5"/><rect x="290" y="93" width="120" height="36" rx="5"/><rect x="430" y="93" width="120" height="36" rx="5"/></g>
  <g text-anchor="middle">
    <text x="70" y="108">Vin fermenté</text><text x="70" y="121">jusqu'au sec</text>
    <text x="210" y="108" fill="#a8843a" font-weight="700">+ Süssreserve</text><text x="210" y="121">moût non fermenté</text>
    <text x="350" y="108">Mise en</text><text x="350" y="121">bouteille</text>
    <text x="490" y="108">Vin avec du</text><text x="490" y="121">sucre résiduel</text>
  </g>
  <g stroke="#625a4e" marker-end="url(#m07-arret-ou-reserve)"><path d="M131 111 H147"/><path d="M271 111 H287"/><path d="M411 111 H427"/></g>
  <text x="280" y="144" text-anchor="middle" font-size="10" fill="#625a4e">schéma de principe, sans alcool ajouté dans les deux cas</text>
</svg>

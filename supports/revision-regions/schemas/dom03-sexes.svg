<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="Inter, sans-serif" font-size="11" fill="#1a1612">
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b1a24"/></marker></defs>
  <rect x="0" y="8" width="255" height="108" rx="6" fill="#faf3e0" stroke="#a8843a"/>
  <text x="127" y="28" text-anchor="middle" font-weight="700" font-size="12" fill="#5b1a24">Vigne sauvage</text>
  <g text-anchor="middle">
    <rect x="22" y="40" width="96" height="30" rx="5" fill="#fff" stroke="#456e8a"/><text x="70" y="59" fill="#456e8a" font-weight="700">pied mâle</text>
    <rect x="137" y="40" width="96" height="30" rx="5" fill="#fff" stroke="#5b1a24"/><text x="185" y="59" fill="#5b1a24" font-weight="700">pied femelle</text>
    <text x="127" y="92">deux sexes sur deux pieds</text><text x="127" y="107" fill="#625a4e">récolte incertaine</text>
  </g>
  <path d="M258 62 H300" stroke="#5b1a24" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="279" y="52" text-anchor="middle" font-size="10" fill="#625a4e">repérage</text>
  <rect x="305" y="8" width="255" height="108" rx="6" fill="#faf3e0" stroke="#a8843a"/>
  <text x="432" y="28" text-anchor="middle" font-weight="700" font-size="12" fill="#5b1a24">Vigne cultivée</text>
  <g text-anchor="middle">
    <rect x="335" y="40" width="195" height="30" rx="5" fill="#fff" stroke="#5c7a4f"/><text x="432" y="59" fill="#5c7a4f" font-weight="700">un pied, les deux fonctions</text>
    <text x="432" y="92">se féconde seul</text><text x="432" y="107" fill="#625a4e">multiplié en clones par bouture</text>
  </g>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#625a4e">Schéma de principe d’une hypothèse : domestiquer, c'est maîtriser la reproduction.</text>

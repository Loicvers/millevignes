<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Atelier des Mille Vignes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16130f;--paper:#faf8f3;--paper2:#f1ede4;--line:#d9d2c4;
    --wine:#5b1a24;--wine-soft:#7a2c38;--gold:#8a6d3b;--muted:#6b6357;
    --green:#5c7a4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;font-size:16px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  header{border-bottom:1px solid var(--line)}
  .head-inner{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:22px 0 18px;flex-wrap:wrap}
  .brand{font-family:'Cormorant',serif;font-weight:600;font-size:30px;letter-spacing:.5px;line-height:1}
  .brand .sub{display:block;font-family:'Inter';font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:7px}

  /* mode tabs */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
  .tab{flex:1;text-align:center;padding:13px 8px;font-size:13px;font-weight:600;letter-spacing:.04em;background:var(--paper2);border:none;border-right:1px solid var(--line);cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s}
  .tab:last-child{border-right:none}
  .tab.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 -3px 0 var(--wine)}
  .tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;font-size:11px;background:var(--wine);color:#fff;border-radius:20px;line-height:18px}

  .filters{background:var(--paper2);border-bottom:1px solid var(--line);padding:16px 0}
  .filt-row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .filt-group{flex:1;min-width:260px}
  .filt-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .filt-label .dot{width:6px;height:6px;border-radius:50%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12.5px;border:1px solid var(--line);background:var(--paper);padding:5px 11px;border-radius:40px;cursor:pointer;color:var(--ink);transition:all .15s;font-family:inherit}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sub-panel{margin-top:10px;padding-top:10px;border-top:1px dotted var(--line);display:none}
  .sub-panel.show{display:block}
  .sub-panel .sub-lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
  .chip.sub{font-size:11.5px;padding:4px 9px}
  .chip.sub.on{background:var(--gold);border-color:var(--gold);color:#fff}

  .geo-tree{font-size:13px}
  .geo-node{cursor:pointer;padding:2px 0;user-select:none}
  .geo-node .tw{display:inline-block;width:14px;color:var(--muted)}
  .geo-pays{font-weight:600}.geo-region{padding-left:16px}.geo-appel{padding-left:34px;color:var(--wine-soft)}
  .geo-appel.on,.geo-region.on{color:var(--wine);font-weight:600}
  .geo-appel:hover,.geo-region:hover,.geo-pays:hover{color:var(--wine)}
  .geo-hidden{display:none}

  .filt-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
  .count{font-size:13px;color:var(--muted)}.count b{color:var(--ink)}
  .clear{font-size:12px;color:var(--wine);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}

  main{padding:26px 0 80px}
  .intro{font-family:'Cormorant',serif;font-size:18px;color:var(--muted);margin-bottom:20px;font-style:italic}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:20px 20px 18px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
  .card.t-geo::before{background:var(--wine)}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:600}
  .tag.theme{background:var(--ink);color:var(--paper)}
  .tag.geo{background:var(--wine);color:#fff}
  .tag.niv{background:var(--paper2);color:var(--muted);border:1px solid var(--line)}
  .tag.due{background:var(--green);color:#fff}
  .sub-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
  .sub-tag{font-size:10px;color:var(--gold);border:1px solid var(--gold);padding:1px 7px;border-radius:30px}
  .card h3{font-family:'Cormorant',serif;font-weight:600;font-size:23px;line-height:1.15;margin-bottom:9px}
  .synth{font-size:14.5px;color:#3a342c;margin-bottom:14px}
  .mnemo{background:var(--paper2);border-left:3px solid var(--gold);padding:10px 12px;font-size:13.5px;border-radius:0 3px 3px 0;margin-bottom:14px}
  .mnemo .m-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;display:block;margin-bottom:3px}
  .tag.ok{color:#3d6b3d;border:1px solid #3d6b3d}
  .tag.warn{color:#9a6a12;border:1px solid #9a6a12}
  .to-check{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .to-check summary{cursor:pointer;color:#9a6a12}
  .schema{margin:0 0 14px;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--paper)}
  .schema svg{display:block;width:100%;height:auto;color:var(--ink)}
  .cours{margin:0 0 14px;font-size:13.5px}
  .cours summary{cursor:pointer;color:var(--wine);font-weight:600}
  .cours .lede{font-style:italic}.cours .ess{border-left:3px solid var(--wine);padding:6px 10px;background:var(--paper2)}
  .cours h4{margin:12px 0 4px;font-size:14px}.cours table{border-collapse:collapse;width:100%;font-size:12.5px}
  .cours td,.cours th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  .cours .imp-essentiel{font-weight:600}.cours .imp-culture{color:var(--muted)}
  .ex-mine{color:var(--muted);font-size:14px;margin-bottom:8px}
  .schema figcaption{font-size:12px;color:var(--muted);margin-top:6px}
  .src{font-size:14px;color:var(--muted);margin-top:auto;padding-top:10px;border-top:1px dotted var(--line);font-style:italic;font-family:'Cormorant',serif}

  .flash{perspective:1000px;margin-bottom:6px;height:92px;cursor:pointer}
  .flash-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .flash.flip .flash-in{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px dashed var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 14px;font-size:13.5px;background:var(--paper)}
  .flash-front{font-weight:500}
  .flash-back{transform:rotateY(180deg);background:var(--ink);color:var(--paper);border-style:solid;border-color:var(--ink)}
  .flash-hint{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:12px}

  .qcm{border-top:1px dotted var(--line);padding-top:13px}
  .q{font-size:13.5px;font-weight:600;margin-bottom:9px}
  .opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:13px;padding:8px 11px;margin-bottom:6px;border:1px solid var(--line);background:var(--paper);border-radius:3px;cursor:pointer;transition:all .12s}
  .opt:hover{border-color:var(--gold)}
  .opt.good{background:#e7efe4;border-color:var(--green);color:#2f4226}
  .opt.bad{background:#f2e2e2;border-color:#a85a5a;color:#6e2a2a}
  .opt:disabled{cursor:default}

  /* spaced-repetition rating */
  .srs{margin-top:13px;border-top:1px dotted var(--line);padding-top:12px;display:none}
  .srs.show{display:block}
  .srs-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;text-align:center}
  .srs-btns{display:flex;gap:6px}
  .srs-btn{flex:1;font-family:inherit;font-size:12px;font-weight:600;padding:9px 4px;border-radius:3px;border:1px solid var(--line);cursor:pointer;background:var(--paper);transition:all .12s}
  .srs-btn .sub2{display:block;font-size:9px;font-weight:400;color:var(--muted);margin-top:2px}
  .srs-hard:hover{background:#f2e2e2;border-color:#a85a5a}
  .srs-ok:hover{background:#f0ead8;border-color:var(--gold)}
  .srs-easy:hover{background:#e7efe4;border-color:var(--green)}
  .srs-done{font-size:12px;color:var(--green);text-align:center;font-weight:600}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty h3{font-family:'Cormorant',serif;font-size:26px;color:var(--ink);margin-bottom:8px}

  footer{border-top:1px solid var(--line);padding:24px 0;font-size:12px;color:var(--muted);text-align:center}
  .reset-all{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}

  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:10px 14px;min-height:44px;border-radius:3px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
  .btn.train{margin:4px 0 12px}
  .session{max-width:680px;margin:0 auto}
  .ex{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:3px;padding:22px}
  .ex-head{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .ex-prompt{font-family:'Cormorant',serif;font-size:24px;font-weight:600;line-height:1.2;margin-bottom:16px}
  .ex-statement,.ex-cloze{font-size:16px;margin-bottom:12px;line-height:2.2}
  .ex-answer{background:var(--ink);color:var(--paper);padding:14px;border-radius:3px;font-size:15px;margin-bottom:12px}
  .ex-input{font-family:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;min-height:44px;width:100%}
  .ex-input.blank{width:9em;min-height:38px;padding:4px 8px;margin:0 3px}
  .opt{min-height:44px;font-size:14px}
  .opt.picked{background:var(--paper2);border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
  .match-row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
  .order{list-style:decimal inside;padding:0}
  .order-item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:6px 8px;margin-bottom:6px;font-size:14px}
  .order-item span{flex:1}
  .mini{min-width:44px;min-height:40px;font-size:16px;border:1px solid var(--line);background:var(--paper2);border-radius:3px;cursor:pointer}
  .mini:disabled{opacity:.35}
  .ex-actions{margin-top:14px}
  .fb{margin-top:14px;font-size:14px}.fb:empty{display:none}
  .fb.good strong{color:var(--green)}.fb.bad strong{color:#8e3b3b}
  .fb-expl{margin-top:6px;color:#3a342c}.fb-src{margin-top:6px;font-family:'Cormorant',serif;font-style:italic;color:var(--muted);font-size:15px}
  @media(max-width:560px){.brand{font-size:25px}.grid{grid-template-columns:1fr}.tab{font-size:11.5px;padding:11px 4px}}
</style>
</head>
<body>

<header>
  <div class="wrap head-inner">
    <div class="brand">L'Atelier des Mille Vignes<span class="sub">Base de révision œnologique</span></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-mode="revision">Fiches</button>
    <button class="tab" data-mode="due">Session du jour <span class="badge" id="dueBadge">0</span></button>
    <button class="tab" data-mode="atelier">Atelier masterclass</button>
  </div>
</header>

<div class="filters" id="filterBar">
  <div class="wrap">
    <div class="filt-row">
      <div class="filt-group">
        <div class="filt-label"><span class="dot" style="background:var(--ink)"></span>Le quoi — Thèmes</div>
        <div class="chips" id="themeChips"></div>
        <div class="sub-panel" id="subPanel"><div class="sub-lbl" id="subLbl">Sous-thèmes</div><div class="chips" id="subChips"></div></div>
      </div>
      <div class="filt-group">
        <div class="filt-label"><span class="dot" style="background:var(--wine)"></span>Le où — Géographie</div>
        <div class="geo-tree" id="geoTree"></div>
      </div>
      <div class="filt-group">
        <div class="filt-label"><span class="dot" style="background:var(--gold)"></span>Niveau</div>
        <div class="chips" id="nivChips"></div>
      </div>
    </div>
    <div class="filt-foot">
      <div class="count"><b id="shown">0</b> fiche(s) · <b id="acq">0</b> exercice(s) déjà travaillé(s)</div>
      <button class="btn primary" id="sessionBtn">S'entraîner</button>
      <button class="clear" id="clearBtn">Réinitialiser les filtres</button>
    </div>
  </div>
</div>

<main><div class="wrap">
  <p class="intro" id="introLine"></p>
  <div class="grid" id="grid"></div>
</div></main>

<footer class="wrap">
  L'Atelier des Mille Vignes — chaque fiche reformulée et créditée à sa source<br><br>
  <button class="reset-all" id="exportProg">Sauvegarder ma progression</button> ·
  <button class="reset-all" id="importBtn">Restaurer une sauvegarde</button><input type="file" id="importProg" accept="application/json,.json" hidden> ·
  <button class="reset-all" id="resetAll">Réinitialiser toute ma progression</button>
</footer>

<script src="fiches.js"></script>
<script src="fiches/016-domestication.js"></script>
<script src="fiches/040-nature.js"></script>
<script src="fiches/150-terroir.js"></script>
<script src="exercices.js"></script>
<script>
/* ============ DONNÉES ============ */
const EXOS=FICHES.flatMap(toExercises);
const EX_BY_ID=Object.fromEntries(EXOS.map(e=>[e.id,e]));
const TYPE_LBL={flashcard:'Flashcard',flashcard_reverse:'Flashcard inversée',mcq_single:'QCM',mcq_multi:'QCM — plusieurs réponses',true_false:'Vrai ou faux',cloze:'Texte à trous',short_answer:'Réponse courte',matching:'Associer',ordering:'Remettre dans l\'ordre',odd_one_out:'Trouver l\'intrus'};
const NIVEAUX=["Fondamental","Intermédiaire","Pointu"];
const SESSION_MAX=20,NEW_MAX=10;

/* ============ PERSISTANCE (localStorage) ============ */
// v2 : progression par exercice. La v1 (par fiche) est reprise une fois, puis laissée intacte.
const PKEY="mv_progress_v2",PKEY_V1="mv_progress_v1";
function fromV1(v1){const p={};for(const k in v1){p[notionId(k)+'-01']={...v1[k]};p[notionId(k)+'-02']={...v1[k]};}return p;}
function load(){
  try{const v2=localStorage.getItem(PKEY);if(v2)return JSON.parse(v2);const v1=localStorage.getItem(PKEY_V1);return v1?fromV1(JSON.parse(v1)):{};}
  catch{return {};}
}
let prog=load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch{}
// prog[exId] = {ease, interval(jours), due(timestamp), acquired:bool}
function save(){try{localStorage.setItem(PKEY,JSON.stringify(prog));}catch{alert('Impossible d\'enregistrer la progression dans ce navigateur. Pense à la sauvegarder (bas de page).');}}
function now(){return Date.now();}
const DAY=86400000;

/* ============ RÉPÉTITION ESPACÉE (type SM-2 simplifié) ============ */
function rate(id,quality){ // quality: 'hard'|'ok'|'easy'
  let p=prog[id]||{ease:2.3,interval:0,due:0,acquired:false};
  if(quality==='hard'){p.ease=Math.max(1.3,p.ease-0.2);p.interval=1;}
  else if(quality==='ok'){p.interval=p.interval?Math.round(p.interval*p.ease):1;}
  else{p.ease=p.ease+0.1;p.interval=p.interval?Math.round(p.interval*p.ease*1.3):2;}
  p.due=now()+p.interval*DAY;
  p.acquired=true;
  prog[id]=p;save();updateBadges();
}
const isDue=e=>prog[e.id]&&prog[e.id].due<=now();
const isNew=e=>!prog[e.id];
// Dus en retard d'abord, puis des nouveaux ; le tout mélangé pour entremêler types et thèmes.
function buildQueue(pool){
  const due=pool.filter(isDue).sort((a,b)=>prog[a.id].due-prog[b.id].due).slice(0,SESSION_MAX);
  const fresh=shuffle(pool.filter(isNew)).slice(0,Math.min(NEW_MAX,SESSION_MAX-due.length));
  return shuffle([...due,...fresh]);
}

/* ============ ÉTAT FILTRES ============ */
let mode="revision";
let activeThemes=new Set(),activeSubs=new Set(),activeGeo=null,activeNiv=new Set();

/* ============ GÉO arbre ============ */
const GEO={};
FICHES.forEach(f=>{if(!f.geo)return;const{pays,region,appel}=f.geo;GEO[pays]=GEO[pays]||{};if(region){GEO[pays][region]=GEO[pays][region]||new Set();if(appel)GEO[pays][region].add(appel);}});

const themeChips=document.getElementById('themeChips');
const subPanel=document.getElementById('subPanel'),subChips=document.getElementById('subChips'),subLbl=document.getElementById('subLbl');
const themesPresent=THEME_ORDER.filter(t=>FICHES.some(f=>f.theme===t));
themesPresent.forEach(t=>{
  const b=document.createElement('button');b.className='chip';b.textContent=t;
  b.onclick=()=>{activeThemes.has(t)?activeThemes.delete(t):activeThemes.add(t);b.classList.toggle('on');buildSub();render();};
  themeChips.appendChild(b);
});
const nivChips=document.getElementById('nivChips');
NIVEAUX.forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
  b.onclick=()=>{activeNiv.has(n)?activeNiv.delete(n):activeNiv.add(n);b.classList.toggle('on');render();};nivChips.appendChild(b);});
function buildSub(){
  subChips.innerHTML='';
  if(activeThemes.size===1){
    const t=[...activeThemes][0];
    if(SOUS[t]&&SOUS[t].length){
      subLbl.textContent='Sous-thèmes — '+t;
      SOUS[t].forEach(s=>{const b=document.createElement('button');b.className='chip sub';b.textContent=s;if(activeSubs.has(s))b.classList.add('on');
        b.onclick=()=>{activeSubs.has(s)?activeSubs.delete(s):activeSubs.add(s);b.classList.toggle('on');render();};subChips.appendChild(b);});
      subPanel.classList.add('show');return;
    }
  }
  activeSubs.clear();subPanel.classList.remove('show');
}

const geoTree=document.getElementById('geoTree');
Object.keys(GEO).forEach(pays=>{
  const pn=document.createElement('div');pn.className='geo-node geo-pays';pn.innerHTML='<span class="tw">▾</span>'+pays;geoTree.appendChild(pn);
  const rw=document.createElement('div');
  Object.keys(GEO[pays]).forEach(region=>{
    const rn=document.createElement('div');rn.className='geo-node geo-region';rn.innerHTML='<span class="tw">›</span>'+region;
    rn.onclick=e=>{e.stopPropagation();selGeo({region});};rw.appendChild(rn);
    [...GEO[pays][region]].forEach(appel=>{const an=document.createElement('div');an.className='geo-node geo-appel';an.textContent=appel;an.onclick=e=>{e.stopPropagation();selGeo({region,appel});};rw.appendChild(an);});
  });
  geoTree.appendChild(rw);
  pn.onclick=()=>{
    if(!Object.keys(GEO[pays]).length){selGeo({pays});return;} // pays sans région (ex. Chypre) : on filtre directement
    rw.classList.toggle('geo-hidden');pn.querySelector('.tw').textContent=rw.classList.contains('geo-hidden')?'▸':'▾';};
});
function selGeo(sel){
  const same=activeGeo&&activeGeo.pays===sel.pays&&activeGeo.region===sel.region&&activeGeo.appel===sel.appel;
  activeGeo=same?null:sel;
  document.querySelectorAll('.geo-node').forEach(n=>n.classList.remove('on'));
  if(activeGeo)document.querySelectorAll('.geo-node').forEach(n=>{const txt=n.textContent.replace(/[›▾▸]/,'').trim();
    if(activeGeo.appel?txt===activeGeo.appel&&n.classList.contains('geo-appel'):activeGeo.region?txt===activeGeo.region&&n.classList.contains('geo-region'):txt===activeGeo.pays&&n.classList.contains('geo-pays'))n.classList.add('on');});
  render();
}
document.getElementById('clearBtn').onclick=()=>{activeThemes.clear();activeSubs.clear();activeNiv.clear();activeGeo=null;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));document.querySelectorAll('.geo-node').forEach(n=>n.classList.remove('on'));subPanel.classList.remove('show');render();};

/* ============ TABS ============ */
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));document.getElementById('filterBar').style.display=m==='due'?'none':'block';render();}
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{if(t.dataset.mode==='due')startSession(buildQueue(EXOS),'Session du jour');else setMode(t.dataset.mode);};});

/* ============ BIBLIOTHÈQUE ============ */
const grid=document.getElementById('grid');
function matches(f){
  if(activeThemes.size&&!activeThemes.has(f.theme))return false;
  if(activeSubs.size){const fs=f.sous||[];if(![...activeSubs].some(s=>fs.includes(s)))return false;}
  if(activeNiv.size&&!activeNiv.has(f.niveau))return false;
  if(activeGeo){if(!f.geo)return false;if(activeGeo.appel)return f.geo.appel===activeGeo.appel;if(activeGeo.region)return f.geo.region===activeGeo.region;return f.geo.pays===activeGeo.pays;}
  return true;
}
function render(){
  if(mode==='due')return;
  const list=FICHES.filter(matches);
  document.getElementById('introLine').textContent= mode==='atelier'?'Filtre par thème ou région pour rassembler la matière d\'une masterclass.':'';
  document.getElementById('shown').textContent=list.length;
  document.getElementById('acq').textContent=EXOS.filter(e=>prog[e.id]).length;
  const pool=list.flatMap(f=>EXOS.filter(e=>e.fiche===f));
  const sb=document.getElementById('sessionBtn');sb.textContent=`S'entraîner sur ces ${list.length} fiche(s)`;sb.disabled=!list.length;
  sb.onclick=()=>startSession(buildQueue(pool).length?buildQueue(pool):shuffle(pool).slice(0,SESSION_MAX),'Session ciblée');
  grid.className='grid';grid.innerHTML='';
  if(!list.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>Aucune fiche ne correspond</h3><p>Ajuste les filtres ou réinitialise.</p></div>`;return;}
  list.forEach(f=>grid.appendChild(card(f)));
}
function coursHTML(c){
  if(!c)return '';
  const b=x=>`<p class="imp-${x.imp}">${x.txt}</p>`;
  const tab=t=>t?`<table>${t.caption?`<caption>${t.caption}</caption>`:''}<tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr>${t.rows.map(r=>`<tr class="imp-${r.imp}">${r.cells.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`:'';
  return `<details class="cours"><summary>Approfondir</summary>
    ${c.lede?`<p class="lede">${c.lede}</p>`:''}${c.essentiel?`<p class="ess">${c.essentiel}</p>`:''}
    ${c.frise?`<ul>${c.frise.map(x=>`<li><b>${x.date}</b> — ${x.txt}</li>`).join('')}</ul>`:''}
    ${(c.sections||[]).map(x=>`<h4>${x.h}</h4>${(x.blocs||[]).map(b).join('')}${tab(x.table)}`).join('')}
    ${c.synthese?`<h4>À retenir</h4>${c.synthese.map(b).join('')}`:''}
    ${c.src?`<p class="imp-culture">${c.src}</p>`:''}</details>`;
}
const schemaHTML=f=>f.schema?`<figure class="schema">${f.schema.svg}<figcaption>${f.schema.legende} — ${f.schema.src}</figcaption></figure>`:'';
function card(f){
  const c=document.createElement('div');c.className='card'+(f.theme==='Géographie viticole'?' t-geo':'');
  const mine=EXOS.filter(e=>e.fiche===f);
  const geoTag=f.geo?`<span class="tag geo">${f.geo.appel||f.geo.region||f.geo.pays}</span>`:'';
  const nDue=mine.filter(isDue).length;
  const dueTag=nDue?`<span class="tag due">${nDue} à revoir</span>`:'';
  const chk=f.to_check||[];
  const statTag=f.status==='verified'?'<span class="tag ok">✓ vérifiée</span>':chk.length?'<span class="tag warn">⚠ à vérifier</span>':'';
  const chkList=chk.length?`<details class="to-check"><summary>Points à vérifier (${chk.length})</summary><ul>${chk.map(t=>`<li>${t}</li>`).join('')}</ul></details>`:'';
  const subTags=(f.sous||[]).map(s=>`<span class="sub-tag">${s}</span>`).join('');
  c.innerHTML=`
    <div class="card-tags"><span class="tag theme">${f.theme}</span>${geoTag}<span class="tag niv">${f.niveau}</span>${statTag}${dueTag}</div>
    <div class="sub-tags">${subTags}</div>
    <h3>${f.titre}</h3>
    <p class="synth">${f.synth}</p>
    ${schemaHTML(f)}
    ${coursHTML(f.cours)}
    ${chkList}
    <div class="mnemo"><span class="m-lbl">Astuce mémo</span>${f.mnemo}</div>
    <div class="flash-hint">Flashcard — touche pour retourner</div>
    <div class="flash" tabindex="0" role="button" aria-label="Retourner la flashcard"><div class="flash-in"><div class="flash-face flash-front">${f.flash.q}</div><div class="flash-face flash-back">${f.flash.a}</div></div></div>
    <button class="btn train">S'entraîner — ${mine.length} exercice(s)</button>
    <div class="src">— ${f.src}${f.page?', p. '+f.page:''}</div>`;
  const flash=c.querySelector('.flash');flash.onclick=()=>flash.classList.toggle('flip');flash.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flash.click();}};
  c.querySelector('.train').onclick=()=>startSession(shuffle(mine),'Fiche : '+f.titre);
  return c;
}

/* ============ SESSION D'EXERCICES ============ */
let queue=[],pos=0,score={ok:0,total:0},sessionTitle='';
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
function startSession(q,title){
  queue=q;pos=0;score={ok:0,total:0};sessionTitle=title;
  mode='due';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode==='due'));
  document.getElementById('filterBar').style.display='none';
  document.getElementById('introLine').textContent='';
  showExercise();window.scrollTo(0,0);
}
function showExercise(){
  grid.className='session';grid.innerHTML='';
  if(pos>=queue.length){
    const box=el('div','empty');
    if(!queue.length){box.append(el('h3',null,'Rien à revoir pour le moment'),el('p',null,'Tous les exercices sont planifiés plus tard. Reviens demain, ou entraîne-toi sur une fiche depuis l\'onglet Fiches.'));}
    else{box.append(el('h3',null,'Session terminée'),el('p',null,score.total?`${score.ok} bonne(s) réponse(s) sur ${score.total} exercice(s) corrigé(s).`:`${queue.length} carte(s) revue(s).`));
      const again=el('button','btn','Retour aux fiches');again.onclick=()=>setMode('revision');box.append(again);}
    grid.append(box);return;
  }
  const ex=queue[pos],p=ex.payload,f=ex.fiche;
  const box=el('div','ex');
  box.append(el('div','ex-head',`${sessionTitle} · ${pos+1}/${queue.length} · ${TYPE_LBL[ex.type]}`));
  box.append(el('div','ex-prompt',ex.prompt));
  const body=el('div','ex-body'),actions=el('div','ex-actions'),fb=el('div','fb');
  box.append(body,fb,actions);grid.append(box);
  const submit=(answer,label='Valider')=>{const b=el('button','btn primary',label);b.onclick=()=>finish(ex,grade(ex,answer()),fb,actions,body);actions.append(b);return b;};
  const choice=(opts,onPick)=>shuffle(opts.map((o,i)=>i)).forEach(i=>{const b=el('button','opt',opts[i]);b.dataset.i=i;b.onclick=()=>onPick(i,b);body.append(b);});
  switch(ex.type){
    case 'flashcard':case 'flashcard_reverse':{
      const inp=el('textarea','ex-input');inp.rows=2;inp.placeholder='Ta réponse (facultatif), puis compare';inp.setAttribute('aria-label','Ta réponse');body.append(inp);
      const show=el('button','btn primary','Voir la réponse');show.onclick=()=>{show.remove();const mine=inp.value.trim();inp.remove();if(mine)body.append(el('p','ex-mine','Ta réponse : '+mine));body.append(el('div','ex-answer',p.answer));finish(ex,null,fb,actions,body);};actions.append(show);break;}
    case 'mcq_single':case 'odd_one_out':
      choice(p.options,(i,b)=>{finish(ex,grade(ex,i),fb,actions,body);b.classList.add(i===p.answer?'good':'bad');body.querySelector(`[data-i="${p.answer}"]`).classList.add('good');});break;
    case 'true_false':
      [['Vrai',true],['Faux',false]].forEach(([t,v])=>{const b=el('button','opt',t);b.onclick=()=>{finish(ex,grade(ex,v),fb,actions,body);b.classList.add(v===p.answer?'good':'bad');};body.append(b);});
      body.prepend(el('p','ex-statement',p.statement));break;
    case 'mcq_multi':{
      const picked=new Set();
      choice(p.options,(i,b)=>{picked.has(i)?picked.delete(i):picked.add(i);b.classList.toggle('picked');b.setAttribute('aria-pressed',picked.has(i));});
      submit(()=>[...picked]);break;}
    case 'short_answer':{
      const inp=el('input','ex-input');inp.placeholder='Ta réponse';inp.setAttribute('aria-label','Ta réponse');body.append(inp);
      const b=submit(()=>inp.value);inp.onkeydown=e=>{if(e.key==='Enter')b.click();};setTimeout(()=>inp.focus());break;}
    case 'cloze':{
      const inputs=[],line=el('p','ex-cloze');
      clozeParts(p.text).forEach((part,i)=>{if(i%2){const inp=el('input','ex-input blank');inp.setAttribute('aria-label','Trou '+(inputs.length+1));inputs.push(inp);line.append(inp);}else line.append(part);});
      body.append(line);const b=submit(()=>inputs.map(x=>x.value));inputs.forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')b.click();});break;}
    case 'matching':{
      const rights=shuffle(p.pairs.map(x=>x[1])),sels=[];
      p.pairs.forEach(([left])=>{const row=el('label','match-row');row.append(el('span',null,left));const s=el('select','ex-input');s.append(new Option('— choisir —',''));rights.forEach(r=>s.append(new Option(r,r)));sels.push(s);row.append(s);body.append(row);});
      submit(()=>sels.map(s=>s.value));break;}
    case 'ordering':{
      let items=shuffle(p.items);if(items.every((x,i)=>x===p.items[i]))items.reverse(); // jamais déjà dans l'ordre
      const list=el('ol','order');
      const draw=()=>{list.innerHTML='';items.forEach((it,i)=>{const li=el('li','order-item');li.append(el('span',null,it));
        const up=el('button','mini','↑'),dn=el('button','mini','↓');up.setAttribute('aria-label','Monter '+it);dn.setAttribute('aria-label','Descendre '+it);up.disabled=!i;dn.disabled=i===items.length-1;
        up.onclick=()=>{[items[i-1],items[i]]=[items[i],items[i-1]];draw();};dn.onclick=()=>{[items[i+1],items[i]]=[items[i],items[i+1]];draw();};li.append(up,dn);list.append(li);});};
      draw();body.append(list);submit(()=>items);break;}
  }
}
function correctText(ex){
  const p=ex.payload;
  switch(ex.type){
    case 'mcq_single':case 'odd_one_out':return p.options[p.answer];
    case 'mcq_multi':return p.answers.map(i=>p.options[i]).join(' ; ');
    case 'true_false':return p.answer?'Vrai':'Faux';
    case 'short_answer':return p.accepted[0];
    case 'cloze':return clozeParts(p.text).map((x,i)=>i%2?x[0]:x).join('');
    case 'matching':return p.pairs.map(x=>x[0]+' → '+x[1]).join(' ; ');
    case 'ordering':return p.items.join(' → ');
  }
  return '';
}
function finish(ex,ok,fb,actions,body){
  body.querySelectorAll('button,input,select').forEach(x=>x.disabled=true);actions.innerHTML='';
  if(ok!==null){score.total++;if(ok)score.ok++;
    fb.className='fb '+(ok?'good':'bad');fb.append(el('strong',null,ok?'Bonne réponse.':'Pas tout à fait.'));
    if(!ok)fb.append(el('p',null,'Réponse attendue : '+correctText(ex)));}
  else fb.className='fb';
  fb.append(el('p','fb-expl',ex.explanation||ex.fiche.synth));
  fb.append(el('p','fb-src',`Fiche : ${ex.fiche.titre}${ex.fiche.page?' — p. '+ex.fiche.page:''}`));
  fb.insertAdjacentHTML('beforeend',schemaHTML(ex.fiche)+coursHTML(ex.fiche.cours));
  const next=()=>{pos++;showExercise();window.scrollTo(0,0);};
  const btns=el('div','srs-btns');
  const before=prog[ex.id];if(ok!==false)rate(ex.id,'ok'); // enregistré tout de suite ; le bouton choisi remplace ce « Correct » provisoire
  const add=(q,t,s)=>{const b=el('button','srs-btn srs-'+q,t);b.append(el('span','sub2',s));b.onclick=()=>{if(before)prog[ex.id]=before;else delete prog[ex.id];rate(ex.id,q);next();};btns.append(b);};
  if(ok===false){rate(ex.id,'hard');const b=el('button','btn primary','Suivant');b.onclick=next;actions.append(b);setTimeout(()=>b.focus());return;}
  if(ok===null)add('hard','Difficile','revoir demain');
  add('ok','Correct','à intervalle');add('easy','Facile','espacer');
  actions.append(el('div','srs-lbl','Comment l\'as-tu retenue ?'),btns);
}
function updateBadges(){document.getElementById('dueBadge').textContent=EXOS.filter(isDue).length+Math.min(NEW_MAX,EXOS.filter(isNew).length);}

updateBadges();render();
/* ============ SAUVEGARDE / RESTAURATION DE LA PROGRESSION ============ */
document.getElementById('exportProg').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'millevignes',version:2,key:PKEY,saved_at:new Date().toISOString(),progress:prog},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='millevignes-progression-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importProg').click();
document.getElementById('importProg').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  let data;try{data=JSON.parse(await file.text());}catch{alert('Fichier illisible : ce n\'est pas un JSON valide.');return;}
  let p=data&&data.app==='millevignes'&&data.progress;
  const ok=p&&typeof p==='object'&&Object.values(p).every(v=>v&&typeof v.due==='number'&&typeof v.interval==='number'&&typeof v.ease==='number');
  if(!ok){alert('Ce fichier n\'est pas une sauvegarde de progression Mille Vignes.');return;}
  if(data.version!==2)p=fromV1(p); // sauvegarde de l'ancien site (par fiche)
  const n=Object.keys(p).length,cur=Object.keys(prog).length;
  if(!confirm(`Restaurer ${n} exercice(s) suivi(s), sauvegardés le ${(data.saved_at||'?').slice(0,10)} ?\nTa progression actuelle (${cur} exercice(s)) sera remplacée.`))return;
  prog=p;save();updateBadges();render();
};
document.getElementById('resetAll').onclick=()=>{if(confirm('Effacer toute ta progression de mémorisation ?')){prog={};save();updateBadges();render();}};
</script>
